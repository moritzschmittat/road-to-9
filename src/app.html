<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road to 9</title>
<meta name="description" content="Road to 9: the GCSE revision planner. We do the planning, you do the learning.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column, one "next session" card that owns the screen; everything else is quiet and secondary. */
:root{
  --blue:#1f6fb2; --blue-soft:#dcebf9;
  --bg:#eef2f5; --surface:#ffffff; --sunk:#e4e9ee; --refbg:#ffffff; --revbg:#f6f8fa; --ink:#13202b; --muted:#566775; --line:#d3dbe2;
  --accent:#1f45d6; --accent-ink:#ffffff; --accent-soft:#e3e9ff;
  --red:#d33f3f; --amber:#d98e0b; --green:#23925a; --grey:#a2adb7;
  --red-soft:#fbe5e5; --amber-soft:#fdf0d6; --green-soft:#ddf3e6;
  --f-display:"Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body:"Manrope", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --blue:#7fb8ea; --blue-soft:#16314a;
  --bg:#0c1218; --surface:#141c24; --sunk:#1b252f; --refbg:#223040; --revbg:#141c24; --ink:#e6edf3; --muted:#93a4b3; --line:#26333f;
  --accent:#7d96ff; --accent-ink:#0c1218; --accent-soft:#1d2747;
  --red:#ef6a6a; --amber:#f0b23c; --green:#49c27b; --grey:#5c6a76;
  --red-soft:#3a1d20; --amber-soft:#3a2c12; --green-soft:#163222; color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#7fb8ea; --blue-soft:#16314a;
  --bg:#0c1218; --surface:#141c24; --sunk:#1b252f; --refbg:#223040; --revbg:#141c24; --ink:#e6edf3; --muted:#93a4b3; --line:#26333f;
  --accent:#7d96ff; --accent-ink:#0c1218; --accent-soft:#1d2747;
  --red:#ef6a6a; --amber:#f0b23c; --green:#49c27b; --grey:#5c6a76;
  --red-soft:#3a1d20; --amber-soft:#3a2c12; --green-soft:#163222; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:none;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* online / offline indicator */
.netpill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;font-size:13px;font-weight:800;color:#fff;letter-spacing:.01em}
.netpill i{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.netpill.ok{background:var(--lv1)}
.netpill.off{background:var(--lv3)}
.netpill.saving{background:var(--lv25);color:#13202b}
.netpill.saving i{background:#13202b;box-shadow:none;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.netpill.saving i{animation:none}}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--f-display);font-weight:600;font-size:23px;letter-spacing:-.01em}
.brand span{color:var(--accent);font-style:italic}
nav{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
nav a{text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px}
nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.sync{font-size:12px;color:var(--muted);text-align:right;min-height:16px}

/* today strip */
.today{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:6px 0 14px}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:inline-block}
.dot.on{background:var(--accent)}
.dot.extra{border-style:dashed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink)}

/* the session card */
.session{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 20px;display:grid;gap:16px;box-shadow:0 8px 28px -18px rgba(20,32,43,.35)}
.session .head{display:grid;gap:6px}
.kind{display:inline-flex;gap:8px;align-items:center}
.subj{font-size:15px;font-weight:700;color:var(--accent)}
.topic{font-size:clamp(28px,6vw,42px);font-weight:600;letter-spacing:-.015em}
.sec{font-size:14px;color:var(--muted)}
.rag{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.rag.r{background:var(--red)}.rag.a{background:var(--amber)}.rag.g{background:var(--green)}.rag.x{background:var(--grey)}
.points{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.points li{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:start;font-size:15px}
.points li .rag{margin-top:5px}
.points .code{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px;min-width:3.6em}
.points li.focus{font-weight:700}
.points li.rated{grid-template-columns:auto auto minmax(0,1fr) auto}
.pr{display:flex;gap:4px}
.pr button{width:26px;height:26px;border-radius:6px;border:0;padding:0;opacity:.35;cursor:pointer}
.pr button:hover{opacity:.7}
.pr button[aria-pressed="true"]{opacity:1;outline:2.5px solid var(--ink);outline-offset:1px}
.rag.lv-x{background:var(--grey)}
.allrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.allrow button{border:0;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;cursor:pointer}
@media (max-width:520px){.points li.rated{grid-template-columns:auto auto minmax(0,1fr)} .points li.rated .pr{grid-column:3}}
.multi{display:grid;gap:12px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.mcard h3{font-size:18px}
.mcard .points li{font-size:14px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-weight:700;font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.steps b{display:block}
.steps span{color:var(--muted);font-size:14px}

.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:12px 14px}
.clock{font-family:var(--f-mono);font-weight:700;font-size:40px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:4.2ch}
.bar{flex:1 1 120px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s linear}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--sunk);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

/* rating */
.rate{display:grid;gap:12px}
.rateitem{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--sunk)}
.rateitem .t{font-weight:700}
.rb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rb button{border:2px solid transparent;border-radius:10px;padding:10px 6px;font-weight:700;font-size:14px;line-height:1.2}
.rb .r{background:var(--red-soft);color:var(--red)} .rb .a{background:var(--amber-soft);color:var(--amber)} .rb .g{background:var(--green-soft);color:var(--green)}
.rb button[aria-pressed="true"]{border-color:currentColor}
.rb small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;margin-top:14px}
.panel h2{font-size:18px}
.note{border-left:3px solid var(--amber);padding-left:12px}
.pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat .n{font-family:var(--f-display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}

/* topics */
.subjlist{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.srow .nm{font-weight:700}
.srow .meta{font-size:12px;color:var(--muted);text-align:right}
.stack{grid-column:1/-1;display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.cardrow{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.cardrow:first-of-type{border-top:0}
.cardrow .nm{font-weight:700}
.cardrow > div{min-width:0}
.cardrow .chip{white-space:normal;display:inline-block;margin-top:2px}
.cardrow .ctrl{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cardrow .ctrl button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}
.cardrow .ctrl button.r[aria-pressed="true"]{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.cardrow .ctrl button.a[aria-pressed="true"]{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.cardrow .ctrl button.g[aria-pressed="true"]{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.cardrow .ctrl button.o[aria-pressed="true"]{background:var(--sunk);color:var(--ink);border-color:var(--ink)}
.secthead{margin-top:18px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.status{font-size:12px;color:var(--muted)}

/* plan */
.wk{display:grid;grid-template-columns:1fr;gap:6px;margin-top:4px}
.wk-day{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:start}
.wk-day.is-today{outline:2px solid var(--accent)}
.wk-day.is-off{opacity:.75}
.wk-h{line-height:1.2}
.wk-dn{font-weight:600;font-family:var(--f-display);font-size:17px}
.wk-dd{font-size:12px;color:var(--muted)}
.wk-l{font-size:11px;color:var(--muted);margin-top:2px}
.wk-ex{font-size:11px;font-weight:700;margin-top:4px;padding:2px 6px;border-radius:6px;background:var(--sunk);color:var(--ink);display:inline-block}
.wk-ex.exam{background:var(--lv3);color:#fff}
.wk-day ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.wk-s{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:7px;padding:5px 6px;font-size:12px;min-width:0}
.wk-s.t-review{border-left-color:var(--green)}
.wk-s.t-paper{border-left-color:var(--amber)}
.wk-s.planned{border-style:dashed;border-left-style:solid;background:transparent}
.wk-s:not(.planned){background:var(--revbg)}
/* refreshers: a brighter box so they stand out from revise sessions */
.wk-s.t-review,.wk-s.t-quick,.wk-s.planned.t-review,.wk-s.planned.t-quick{background:var(--refbg)}
.wk-k{font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.wk-k .rag{width:8px;height:8px}
.wk-sub{font-weight:700}
.wk-t{color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wk-miss{font-size:12px;color:var(--red)}
.wk-tick{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--lv1);color:#fff;font-size:10px;font-weight:800;margin-right:5px;vertical-align:-2px}
.wk-ov{margin-top:6px;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:7px;padding:3px 8px;font-size:11px;font-weight:700}
.wk-free{font-size:12px;color:var(--muted)}
@media (max-width:520px){.wk-day{grid-template-columns:84px minmax(0,1fr)}.wk-day ul{grid-template-columns:1fr}}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.grid7 label{display:grid;gap:4px;font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.grid7 input{text-align:center;font-variant-numeric:tabular-nums}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0;width:100%}
.periods{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 64px 32px;gap:6px;align-items:center}
.prow .x,.paprow .x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
.exams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px);gap:6px 10px;align-items:center}
.papgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px;margin-top:12px}
.papsub{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.paph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.paprow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) 28px;gap:6px;align-items:center}
.paphead{font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.papsub [data-addpaper]{align-self:flex-start}
@media (max-width:520px){.paprow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 24px;gap:4px}.paprow .pn{grid-column:1/-1;margin-top:4px}.paprow input[type=date]{padding:7px 4px;font-size:14px}.paphead span:first-child{display:none}.papsub{padding:10px 8px}}
.hist{display:grid;gap:6px;font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
@media (max-width:520px){
  .session{padding:18px 16px}
  .prow{grid-template-columns:1fr 1fr;}
  .prow input:first-child{grid-column:1/-1}
  .clock{font-size:34px}
}
/* subject board: one column per section, like the spreadsheet */
:root{--lv1:#1e8a4c;--lv15:#8cc84b;--lv2:#f2cf1d;--lv25:#f39a1e;--lv3:#d63a3a;--lvx:var(--sunk);--cell-ink:#13202b}
.bhead-top{display:flex;justify-content:flex-start;gap:16px 28px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.bhead-top > .pctbox{margin-left:auto}
.key{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.key span{display:inline-flex;gap:5px;align-items:center}
.cellkey{display:inline-grid;place-items:center;width:26px;height:20px;border-radius:4px;font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:700}
.lv-1{background:var(--lv1);color:#fff}.lv-15{background:var(--lv15);color:var(--cell-ink)}.lv-2{background:var(--lv2);color:var(--cell-ink)}.lv-25{background:var(--lv25);color:var(--cell-ink)}.lv-3{background:var(--lv3);color:#fff}.lv-x{background:var(--lvx);color:var(--muted)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(340px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;align-items:start;margin-top:8px}
.bcol{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;display:grid;align-content:start}
.bcol-h{position:sticky;top:0;padding:12px 14px;border-bottom:2px solid var(--ink);display:grid;gap:6px;background:var(--surface);border-radius:12px 12px 0 0}
.bsec{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.2}
.bchunk{padding:10px 14px 12px;border-top:1px solid var(--line);display:grid;gap:6px}
.bchunk:first-of-type{border-top:0}
.bchunk.dim{opacity:.55}
.bch-h{display:flex;gap:8px;align-items:center}
.optchip{white-space:normal;display:inline-block;max-width:100%;border-radius:8px;line-height:1.35}
.bch-h .nm{font-weight:700}
.bpts{display:grid;gap:2px}
.bpt{display:grid;grid-template-columns:var(--codew,3.6em) minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px;line-height:1.35;padding:3px 0}
.bpt .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.cell{width:40px;height:28px;border:0;border-radius:5px;cursor:pointer}
.cell.lv-x,.cellkey.lv-x{background:transparent;border:1.5px dashed var(--grey)}
.cell[aria-expanded="true"]{outline:2px solid var(--accent);outline-offset:1px}
.swatches{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;padding:2px 0 6px}
.swatches button{width:36px;height:26px;border:0;border-radius:5px;font-family:var(--f-mono);font-weight:700;font-size:11px}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink)}
.swatches .clr{width:auto;padding:0 8px;background:var(--sunk);color:var(--muted);font-family:var(--f-body);font-size:12px}
.bch-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bch-f .ctrl{display:flex;gap:4px}
.bch-f .ctrl button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.bch-f .ctrl button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);border-color:var(--ink)}
.histbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:2px 4px;margin-left:auto;margin-right:6px}
.histbtn[aria-expanded="true"]{text-decoration:underline}
.thist{margin-top:8px;padding:10px;border-radius:8px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.hspark{display:flex;align-items:flex-end;justify-content:flex-start;gap:3px;height:28px}
.hspark i{flex:0 0 10px}
.hspark i{width:10px;border-radius:2px;display:block}
.hspark i.lv-1{background:var(--lv1)}.hspark i.lv-15{background:var(--lv15)}.hspark i.lv-2{background:var(--lv2)}.hspark i.lv-25{background:var(--lv25)}.hspark i.lv-3{background:var(--lv3)}
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hlist li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:2px 8px;font-size:12.5px;align-items:baseline}
.hd{color:var(--muted)}
.hv{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.hpts{grid-column:2/-1;display:inline-flex;gap:3px;align-items:center}.hpts small{color:var(--muted);margin-left:4px;font-size:11px}
.hn{grid-column:2/-1;margin:0;font-style:italic;color:var(--muted);white-space:pre-wrap}

/* progress percentages */
.pct{font-family:var(--f-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pct small{font-size:.6em;margin-left:1px;color:var(--muted)}
.pct.big{font-size:44px;line-height:1}
.pctbox{display:grid;gap:2px;justify-items:end;text-align:right}
.pctpair{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.pctpair .pctbox .small{max-width:340px}
.bhead-top .pctpair{margin-left:auto}
.pp{display:inline-flex;gap:14px;justify-content:flex-end;align-items:baseline}
.pp > span{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.ppl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.srow .meta .pp{margin-bottom:4px}
/* today's list */
.tl-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;font-size:13px}
.tl > div{min-width:0}
.tl.done{opacity:.6;border-left-color:var(--lv1)}
.tl.now{border:2px solid var(--accent);background:var(--accent-soft)}
.tl-tag{font-weight:800;font-size:12px;white-space:nowrap;display:flex;gap:3px;align-items:center}
.tl-tag.now{color:var(--accent)}
.tl-tag .rag{width:9px;height:9px}
/* timeline */
.tl-chart{position:relative;margin-top:6px;overflow:hidden}
.tl-chart svg{display:block;max-width:100%;font-family:var(--f-body)}
.tl-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;line-height:1.35;white-space:nowrap}
.tl-ctrl{gap:8px}
.jbox{display:flex;flex-direction:column;gap:6px;margin:14px 0 4px}
.jbox textarea,.jedit{width:100%;font:inherit;font-size:15px;line-height:1.45;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical;min-height:72px}
.todobox{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.todobox textarea{width:100%;font:inherit;font-size:14px;line-height:1.45;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;min-height:52px}
.todoshow{margin:12px 0 4px;padding:12px 14px;border-radius:10px;background:var(--sunk);border-left:4px solid var(--lv2)}
.todoitem p{margin:4px 0 6px;white-space:pre-wrap;line-height:1.5;font-size:15px}
.todoitem b{font-size:13px}
.jday{font-weight:700;font-size:13px;margin:14px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
.jday:first-of-type{border-top:0;padding-top:0}
.jentry{padding:6px 0}
.jmeta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px}
.jtext{margin:4px 0 0;white-space:pre-wrap;line-height:1.5}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:0;margin-left:auto}
.tl-ctrl select{width:auto;min-width:150px}
.chooser{border:2px solid var(--accent);scroll-margin-top:140px}
.chrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:10px;align-items:end;margin:10px 0}
.chrow label{display:flex;flex-direction:column;gap:4px}
@media (max-width:640px){.chrow{grid-template-columns:1fr}}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* collapsible how-to */
details.howto{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details.howto summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700;color:var(--muted)}
details.howto summary::-webkit-details-marker{display:none}
details.howto .q{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:800}
details.howto[open] summary{margin-bottom:10px;color:var(--ink)}
.howlist{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px;color:var(--muted)}
/* evening routine */
.checkin{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:16px 20px;display:grid;gap:10px;margin:6px 0 14px}
.checkin h2{font-size:22px}
.hq{display:grid;gap:8px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:16px;font-weight:600}
.hbtn{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 22px;font-weight:700}
.hbtn.yes[aria-pressed="true"]{background:var(--lv1);border-color:var(--lv1);color:#fff}
.hbtn.no[aria-pressed="true"]{background:var(--lv3);border-color:var(--lv3);color:#fff}
.hgrid-row{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.hname{display:grid}
.hcells{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.hc{height:30px;border-radius:6px;border:1.5px dashed var(--grey);background:transparent;color:var(--muted);font-size:11px;font-weight:700;padding:0;cursor:pointer}
.hc.y{background:var(--lv1);border:0;color:#fff}
.hc.n{background:var(--lv3);border:0;color:#fff}
.hc-k{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px dashed var(--grey)}
.hc-k.y{background:var(--lv1);border:0}.hc-k.n{background:var(--lv3);border:0}
@media (max-width:520px){ .hgrid-row{grid-template-columns:1fr} .hc{height:26px;font-size:10px} }
/* header: countdowns and the daily quote, between the title and the menu */
.hdrmeta{flex:1 1 360px;display:grid;justify-items:center;gap:4px;min-width:0;text-align:center}
.hdrmeta .chips{justify-content:center}
.hdrmeta .qsmall{text-align:center}
@media (max-width:900px){ .hdrmeta{order:3;flex-basis:100%;justify-items:start;text-align:left} .hdrmeta .chips{justify-content:flex-start} .hdrmeta .qsmall{text-align:left} }
/* small daily quote on Today */
.qsmall-wrap{display:grid;gap:6px;justify-items:end;max-width:560px;min-width:0}
.qsmall{margin:0;font-family:var(--f-display);font-style:italic;font-size:15px;line-height:1.35;color:var(--ink);text-align:right;text-wrap:balance}
.qsmall span{font-family:var(--f-body);font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:640px){ .qsmall-wrap{justify-items:start} .qsmall{text-align:left} .qsmall-wrap .chips{justify-content:flex-start!important} }
/* rate-these-topics box: full width, red frame until everything is rated */
.panel.setup{border:2px solid var(--lv3);margin:0 0 14px}
/* clickable session details */
details.sx{min-width:0;flex:1}
details.sx summary{list-style:none;cursor:pointer}
details.sx summary::-webkit-details-marker{display:none}
details.sx summary .wk-k::after{content:" ▸";color:var(--muted)}
details.sx[open] summary .wk-k::after{content:" ▾"}
details.sx[open] .wk-t{-webkit-line-clamp:unset;display:block}
.sd{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink)}
.sd-sec{color:var(--muted);margin-bottom:4px}
.sd-pts{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.sd-pts li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px;align-items:start}
.sd-pts .rag{width:9px;height:9px;margin-top:3px}
.sd-pts .code{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;padding-top:1px}
.tl{align-items:flex-start}
/* time progress on Today */
.timebar{display:flex;align-items:center;gap:10px;margin-top:4px}
.timebar .tb{width:160px;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.timebar .tb i{display:block;height:100%;background:var(--accent)}
.wk-time{font-size:12px;font-weight:800;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
/* subject icons */
.sicon{flex:none;vertical-align:-3px}
.subj .sicon,.sp .nm .sicon,.btn .sicon{margin-right:6px}
.subj{display:inline-flex;align-items:center}
.itile{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);flex:none;margin-right:10px;vertical-align:middle}
h1 .itile{width:46px;height:46px;margin-right:0}
.srow .nm{display:flex;align-items:center}
.sp .nm{display:flex;align-items:center}
/* home */
.homegrid{display:grid;gap:14px;margin-top:6px}
.quote{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:22px 24px;display:grid;gap:8px;align-content:center}
.quote .eyebrow{color:inherit;opacity:.8}
.quote blockquote{margin:0;font-family:var(--f-display);font-weight:500;font-style:italic;font-size:clamp(20px,2.4vw,30px);line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.quote .who{font-size:14px;opacity:.85}
.hnext{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:4px;align-content:start}
.hn-t{font-size:24px;letter-spacing:-.01em}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px}
.tnum{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.tnum b{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1}
.tnum span{color:var(--muted);font-size:18px;font-weight:700}
.tbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent)}
.homegrid2{display:grid;gap:0 14px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.mday{border-radius:8px;padding:6px 7px;min-height:52px;display:grid;align-content:space-between;background:var(--sunk);font-variant-numeric:tabular-nums}
.mday .md{font-size:12px;font-weight:700}
.mday .mc{font-size:12px;font-family:var(--f-mono);justify-self:end}
.mday.out{opacity:.35}
.mday.now{outline:2px solid var(--accent)}
.mday.fut{background:transparent;border:1px dashed var(--line)}
.mday.pre{background:transparent;color:var(--muted)}
.mday.met{background:var(--green-soft);color:var(--green)}
.mday.part{background:var(--blue-soft);color:var(--blue)}
.mday.miss{background:var(--red-soft);color:var(--red)}
.mday.off{background:var(--sunk);color:var(--muted)}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px}
.lg.met{background:var(--green-soft);border:1px solid var(--green)}.lg.part{background:var(--blue-soft);border:1px solid var(--blue)}.lg.miss{background:var(--red-soft);border:1px solid var(--red)}.lg.off{background:var(--sunk);border:1px solid var(--line)}
.sprog{display:grid;gap:8px;margin-top:6px}
.sp{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:10px;align-items:center;text-decoration:none;color:inherit;font-size:14px}
.sp .stack{grid-column:auto}
.sp .nm{font-weight:700}
.sp .small{text-align:right}
@media (min-width:1000px){ .homegrid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
@media (max-width:520px){ .sp{grid-template-columns:100px minmax(0,1fr) 120px} .sp > .small{display:none} .mday{min-height:42px;padding:4px} .mday .mc{font-size:10px} }
/* widescreen: use the full width */
.sbody{display:grid;gap:16px}
.rategrid{display:grid;gap:12px}
@media (min-width:1000px){
  .cols{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(300px,1fr);gap:20px;align-items:start}
  .side .panel:first-child{margin-top:0}
  .sbody{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
  .multi{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .rategrid{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
  .subjlist{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}

  .cardlist .secthead{break-after:avoid}
  .wk{grid-template-columns:repeat(7,minmax(0,1fr))}
  .wk-day{grid-template-columns:1fr;gap:6px;align-content:start}
  .wk-day ul{grid-template-columns:1fr}
  .plangrid{display:block}
}
@media (min-width:1600px){ .cardlist{columns:3} }
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.obpts .code{font-family:var(--f-mono);font-size:11.5px;color:var(--ink);opacity:.75;padding-top:1px;min-width:2.6em}

/* ===== Road to 9 look (logo colours: deep navy + lime) ===== */
:root{

<script>
const ALL_SUBJECTS = /*CURRICULUM*/[];
/* the subjects this student takes (Settings → Your subjects); everything else is hidden */
let CURRICULUM = ALL_SUBJECTS;
function applySubjects(){ const on = (S && S.settings && S.settings.subjects) || []; CURRICULUM = ALL_SUBJECTS.filter(x => on.includes(x.id)); }

/* ---------- dates ---------- */
const DAY = 86400000;
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const parse = s => new Date(s+'T12:00:00Z');
let FORCE_DAY = null; // used only while forecasting
const todayStr = () => { if (FORCE_DAY) return FORCE_DAY; const n=new Date(); return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate()); };
const addDays = (s,n) => iso(new Date(parse(s).getTime()+n*DAY));
/* exam and mock dates from the papers list (falls back to 10 May / the mock week) */
const paperDates = (sid, st, k) => ((st || S.settings).papers && (st || S.settings).papers[sid] || []).map(q => q[k]).filter(Boolean).sort();
const examFirst = (sid, st) => paperDates(sid, st, 'exam')[0] || '2027-05-10';
const examLast = (sid, st) => { const d = paperDates(sid, st, 'exam'); return d.length ? d[d.length-1] : examFirst(sid, st); };
const mockFirst = (sid, st) => paperDates(sid, st, 'mock')[0] || ((st || S.settings).mocks || {}).from;
const diff = (a,b) => Math.round((parse(b)-parse(a))/DAY); // b - a in days
const fmtDay = s => parse(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short',timeZone:'UTC'});
const fmtShort = s => parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
const hash = s => { let h=2166136261; for (const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; };

/* ---------- curriculum index ---------- */
const SUBJ = {}; const CARD = {};
ALL_SUBJECTS.forEach(s => { SUBJ[s.id]=s; s.cards.forEach((c,i) => { c.sid=s.id; c.i=i; CARD[c.id]=c; }); });

/* ---------- default settings ---------- */
/* exam papers per subject (Higher tier); dates are filled in from the timetable in Settings */
const DEFAULT_PAPERS = {
  bio:['Paper 1','Paper 2'], chem:['Paper 1','Paper 2'],
  cs:['Paper 1: Principles of computer science','Paper 2: Application of computational thinking'],
  maths:['Paper 1H','Paper 2H'], fm:['Paper 1 (non-calculator)','Paper 2 (calculator)'],
  phys:['Paper 3: Breadth in physics','Paper 4: Depth in physics'],
  geog:['Paper 1: Living with the physical environment','Paper 2: Challenges in the human environment','Paper 3: Geographical applications'],
  englit:['Paper 1: Poetry and modern prose','Paper 2: Modern drama and literary heritage'],
  englang:['Paper 1'],
  ger:['Paper 1: Listening','Paper 2: Reading and writing','Paper 3: Speaking'],
  spa:['Paper 1: Listening','Paper 2: Reading and writing','Paper 3: Speaking']
};
const defaultPapers = () => { const o = {}; ALL_SUBJECTS.forEach(s => o[s.id] = (DEFAULT_PAPERS[s.id]||['Paper 1']).map(n => ({n, mock:'', exam:''}))); return o; };
function defaultSettings(){
  const exams = {}; ALL_SUBJECTS.forEach(s => exams[s.id] = '2027-05-10');
  return {
    startedOn: todayStr(),
    unit: 'min',
    week: {0:120,1:60,2:60,3:60,4:60,5:60,6:120},   // minutes of study, Sun..Sat during term
    dayOffNote: {},
    weekendStart: '10:00',
    papersFrom: '2027-03-20',
    mocks: {from:'', to:'', target:90},
    // typical dates: change them to your school's
    periods: [
      {name:'Christmas holiday', from:'2026-12-19', to:'2027-01-03', target:180},
      {name:'February half term', from:'2027-02-13', to:'2027-02-21', target:180},
      {name:'Easter holiday', from:'2027-03-27', to:'2027-04-11', target:180},
      {name:'Exam season', from:'2027-05-10', to:'2027-06-18', target:180}
    ],
    name: '',
    subjects: [],
    routine: false,
    onboarded: false,
    ob: {step:'welcome', i:0},
    exams,
    papers: defaultPapers()
  };
}

/* ---------- state ---------- */
let LS = 'roadto9:signedout';
// Came back from the "confirm deletion" email link? (read before the address is tidied up)
const DELETE_CONFIRMED = new URLSearchParams(location.search).get('delete') === 'confirm';
var lastSnap = null;
let S = null; // {v, updated, cards:{id:state}, settings, log:[]}
function fresh(){ return {v:1, updated:0, cards:{}, pts:{}, habits:{}, hist:{}, settings:defaultSettings(), log:[]}; }
function normalise(x){
  const f = fresh();
  if (!x || typeof x!=='object') return f;
  const s = Object.assign(f, x);
  const xs = x.settings || {};
  s.settings = Object.assign(defaultSettings(), xs);
  if (xs.unit !== 'min'){   // older saves counted sessions: convert to minutes (1 session = 45 min)
    if (xs.week){ s.settings.week = {}; Object.keys(xs.week).forEach(k => s.settings.week[k] = (+xs.week[k]||0)*45); }
    if (xs.mocks) s.settings.mocks = Object.assign({}, xs.mocks, {target:(+xs.mocks.target||0)*45});
    if (xs.periods) s.settings.periods = xs.periods.map(q => Object.assign({}, q, {target:(+q.target||0)*45}));
    if (xs.overrides){ s.settings.overrides = {}; Object.keys(xs.overrides).forEach(k => s.settings.overrides[k] = (+xs.overrides[k]||0)*45); }
    s.settings.unit = 'min';
  }
  s.settings.exams = Object.assign(defaultSettings().exams, (x.settings||{}).exams||{});
  // planners moved over from before subjects could be chosen took every subject, and had the routine check
  const used = Object.keys(x.cards||{}).length || (x.log||[]).length;
  if (!Array.isArray(xs.subjects)) s.settings.subjects = used ? ALL_SUBJECTS.map(q => q.id) : [];
  if (typeof xs.routine !== 'boolean') s.settings.routine = Object.keys(x.habits||{}).length > 0;
  if (typeof xs.name !== 'string') s.settings.name = '';
  if (typeof xs.onboarded !== 'boolean') s.settings.onboarded = !!used;
  if (!xs.ob || typeof xs.ob !== 'object') s.settings.ob = {step:'welcome', i:0};
  if (!s.settings.mocks) s.settings.mocks = {from:'', to:'', target:90};
  const dp = defaultPapers(); const xp = xs.papers || {};
  s.settings.papers = {}; ALL_SUBJECTS.forEach(sb => {
    let list = Array.isArray(xp[sb.id]) ? xp[sb.id].map(q => ({n:q.n||'Paper', mock:q.mock||'', exam:q.exam||''})) : dp[sb.id];
    // an older single "first exam" date that isn't the default becomes paper 1's exam date
    if (!xs.papers && xs.exams && xs.exams[sb.id] && xs.exams[sb.id] !== '2027-05-10' && list[0]) list[0].exam = xs.exams[sb.id];
    s.settings.papers[sb.id] = list; });
  ALL_SUBJECTS.forEach(sb => s.settings.exams[sb.id] = examFirst(sb.id, s.settings));
  s.cards = x.cards || {}; s.pts = x.pts || {}; s.habits = x.habits || {}; s.hist = x.hist || {}; s.log = x.log || []; s.mt = x.mt || {}; s.notes = x.notes || {}; s.todo = x.todo || {}; s.rh = x.rh || {};
  // refreshers only for topics revised with the plan: anything else goes back to "revise first"
  const studied = new Set(s.log.flatMap(l => l.c || []));
  const cards = {}; Object.keys(s.cards).forEach(id => { const c = s.cards[id];
    if (c && !c.lr && studied.has(id)) cards[id] = Object.assign({}, c, {lr:1});
    else if (c && !c.lr && c.st==='review') cards[id] = {st:'new', lvl:c.lvl, n:c.n||0};
    else cards[id] = c; });
  s.cards = cards;
  return s;
}
S = fresh();
lastSnap = JSON.parse(JSON.stringify(S));

const INTERVALS = [1,3,7,16,35,70];
const REVIEW_N = 5; // (kept for older code paths)
/* refresher plan after learning a topic: 1st 10 min next day, 2nd 10 min 3 days later, then 5 min after 1 week, 2 weeks and 1 month (and monthly after that) */
const R_DUR = [10, 10, 5, 5, 5], R_GAP = [1, 3, 7, 14, 30];
const refMin = id => { const x = cs(id); return x.trk ? 5 : R_DUR[Math.min(x.stg||0, 4)]; };
/* topics rated green after revising get fewer, shorter refreshers spread out until the exam:
   very strong (dark green) 2 x 5 min, strong (light green) 3 x 5 min */
const GREEN_LEFT = {g1:2, g2:3};
function spreadDue(c, today, left){
  const end = S.settings.exams[c.sid] || '2027-05-10';
  const T = diff(today, end) - 3;                       // land the last one a few days before the exam
  const gap = Math.max(3, Math.round(T/(left+1)) + (hash(c.id+today)%5) - 2);
  return addDays(today, gap);
}
/* revise sessions: 20 min first time for topics you rated strong or very strong, 45 min first time otherwise,
   30 min to revise again after a weak result */
const SHORT_REV = 20, RE_REV = 30;
const learnMin = id => { const x = cs(id); return x.st==='learning' ? RE_REV : x.st==='new' && band(x.lvl)==='g' ? SHORT_REV : 45; };
const fmtMin = m => { m = Math.round(m||0); if (m < 60) return m + ' min'; const h = Math.floor(m/60), r = m%60; return h + 'h' + (r ? ' ' + r + 'm' : ''); };
const sessMins = l => l.mins != null ? l.mins : (l.t==='learn' || l.t==='paper') ? 45 : (l.c||[]).length*8;
const band = l => l==null ? 'x' : (l<=1.5 ? 'g' : (l<2.5 ? 'a' : 'r'));
const bandName = {r:'Red', a:'Amber', g:'Green', x:'Not rated'};
/* five-colour scale shown everywhere: 1 very strong, 1.5 strong, 2 ok, 2.5 weak, 3 very weak */
const snap = v => v==null ? null : Math.min(3, Math.max(1, Math.round(v*2)/2));
const lvClass = v => 'lv-' + (v==null ? 'x' : String(snap(v)).replace('.',''));
const toR3 = v => band(v)==='g' ? 1 : band(v)==='a' ? 2 : 3;   // what the scheduler does with it

function baseState(c){
  if (c.r0==null) return {st:'unrated'};
  // every topic gets a revise session first (weakest first); refreshers only start after it
  return {st:'new', lvl:c.r0, n:0};

const cs = id => S.cards[id] || baseState(CARD[id]);

function pickNext(mode){

}

/* ---------- pace check ---------- */
function pace(){
  const today = todayStr(); const live = liveSubjects(today);
  let learnNeed=0, active=0, unrated=0;
  live.forEach(s => s.cards.forEach(c => {
    const x = cs(c.id);
    if (x.st==='new' || x.st==='learning'){ const m = learnMin(c.id); learnNeed += m===45 ? 1.25 : m/45 + 0.15; active++; }
    else if (x.st==='review') active++;
    else if (x.st==='unrated'){ unrated++; learnNeed += 1.0; active++; }
  }));
  // refresher minutes still to come: green topics 5 min each that are left, others the rest of 10+10+5+5+5,
  // topics not revised yet about 25 min on average (some will come out green)
  let refMins = 0;
  live.forEach(sb => sb.cards.forEach(c => { const x = cs(c.id);
    if (x.st==='review') refMins += x.trk ? 5*(x.left||0) : R_DUR.slice(Math.min(x.stg||0, 5)).reduce((a,b) => a+b, 0);
    else if (x.st==='new' || x.st==='learning' || x.st==='unrated') refMins += 25; }));
  const reviewNeed = Math.round(refMins/45);
  const end = live.reduce((m,s)=> examLast(s.id) > m ? examLast(s.id) : m, today);
  let cap = 0; for (let d=today; d<end; d=addDays(d,1)) cap += dayInfo(d).target;
  cap -= Math.min(doneOn(today), dayInfo(today).target);
  return {need: Math.round(learnNeed)+reviewNeed, learnNeed:Math.round(learnNeed), reviewNeed, cap, end, unrated};
}

  stamp(); lastSnap = clone(S);
  S.updated = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}
  if (dbRef) pushOnline(); else { setState('local'); setSync('⚠ Saved on this device only' + noDbReason); }
  render();
}
window.addEventListener('online', () => { if (pendingSync) pushOnline(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && dbRef){ dbRef.get().then(s => { if (s.exists) applyRemote(normalise(s.data()), true); }).catch(()=>{}); if (pendingSync) pushOnline(); } });
function applyRemote(remote, confirmed){
  const merged = merge(S, remote);
  const changed = !same(merged, S);
  if (changed){ S = merged; lastSnap = clone(S); try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} render(); }
  // only send something up if this device really has newer entries than the cloud
  if (confirmed && !pendingSync && localIsAhead(merged, remote)) pushOnline();
  else if (!pendingSync){ setState('ok'); setSync('✓ Synced at ' + hhmm()); }
}

/* ---------- Supabase: sign-in and the student's own progress row ---------- */
const SB_URL = '%%SUPABASE_URL%%', SB_KEY = '%%SUPABASE_KEY%%';
let sb = null, USER = null, liveChannel = null;
function supaRef(uid){
  const ref = {
    async get(){ const {data, error} = await sb.from('progress').select('doc').eq('user_id', uid).maybeSingle(); if (error) throw error; return {exists: !!data, data: () => data && data.doc}; },
    async set(doc){ const {error} = await sb.from('progress').upsert({user_id: uid, doc}); if (error) throw error; },
    onSnapshot(cb, onErr){
      const pull = () => ref.get().then(s => cb({exists: s.exists, data: s.data, metadata: {}})).catch(e => onErr && onErr(e));
      pull();
      // another device saved: fetch the row again (the change event itself may be cut short for big rows)
      liveChannel = sb.channel('progress-' + uid)
        .on('postgres_changes', {event: '*', schema: 'public', table: 'progress', filter: 'user_id=eq.' + uid}, () => pull())
        .subscribe();
    }
  };
  return ref;
}
async function connect(){
  if (!USER){ setState('local'); return; }
  dbRef = supaRef(USER.id);
  setState('saving');
  const t = setTimeout(() => setSync('Can’t reach online storage yet. Using this device’s copy.'), 10000);
  dbRef.onSnapshot(snap => {
    if (snap.metadata && snap.metadata.hasPendingWrites) return;
    if (!snap.metadata || !snap.metadata.fromCache) clearTimeout(t);
    if (!snap.exists){ if (S.updated) pushOnline(); else { setState('ok'); setSync('Ready · progress will sync across your devices'); } return; }
    applyRemote(normalise(snap.data()), !(snap.metadata && snap.metadata.fromCache));
  }, err => { clearTimeout(t); setState('local'); setSync('⚠ Online sync is off for this visit. Saved on this device.'); });
  // belt and braces: check the cloud every 20 seconds while the page is open
  setInterval(() => { if (document.visibilityState==='visible' && !pendingSync) dbRef.get().then(s => { if (s.exists) applyRemote(normalise(s.data()), true); }).catch(()=>{}); }, 20000);
}

/* today's sessions: the one in front of you plus what the scheduler expects for the rest of today, in any order you like */
let todayRest = [];
/* mix refreshers in between revise sessions instead of always doing them first.
   Refreshers are split into small packs placed before, between and after the 45-minute blocks.
   Which kind starts depends on what was done last today (so it alternates), else on the date. */
const isRef = n => n.type==='review' || n.type==='quick';
function startKind(d, after){
  if (after) return isRef(after) ? 'block' : 'ref';
  const last = S.log.filter(l => l.d===d).slice(-1)[0];
  if (last) return (last.t==='review' || last.t==='quick') ? 'block' : 'ref';
  return Math.round(parse(d).getTime()/864e5) % 2 ? 'block' : 'ref';
}
function mixDay(list, start){
  const blocks = list.filter(n => !isRef(n));
  const refs = list.filter(isRef).flatMap(n => n.cards.map(id => ({type:n.type, id, m: n.cm && n.cm[id] != null ? n.cm[id] : refMin(id)})));
  if (!refs.length || !blocks.length) return list;
  const slots = start==='ref' ? blocks.length + 1 : blocks.length;      // refresher groups
  const groups = Array.from({length:slots}, () => []);
  refs.forEach((r, i) => groups[Math.floor(i*slots/refs.length)].push(r));
  const packOf = g => { const cm = {}; g.forEach(r => cm[r.id] = r.m); return {type:g[0].type, cards:g.map(r => r.id), mins:g.reduce((a,r) => a + r.m, 0), cm}; };
  const out = [];
  if (start==='ref'){ groups.forEach((g, i) => { if (g.length) out.push(packOf(g)); if (blocks[i]) out.push(blocks[i]); }); }
  else blocks.forEach((b, i) => { out.push(b); if (groups[i].length) out.push(packOf(groups[i])); });
  return out;
}
function restOfToday(n){
  const today = todayStr(); const out = [];
  if (n <= 0) return out;
  const keepS = S, keepSkip = skipped, keepSkipDay = skipDay;
  S = JSON.parse(JSON.stringify(keepS)); skipped = new Set(keepSkip); skipDay = today;
  if (current){ current.cards.forEach(id => skipped.add(id)); if (current.type==='paper') skipped.add('paper:'+current.sid);
    S.log.push({d:today, t:current.type, s: current.sid || CARD[current.cards[0]].sid, c:current.cards, r:[], mins:current.mins}); }
  try {
    for (let left=n, guard=0; left>0 && guard<30; guard++){
      const x = pickNext(); if (!x) break;
      if ((x.type==='learn' || x.type==='paper') && left < Math.min(30, (x.mins||45) - 5)) break;   // not enough time left for a full block
      out.push(x); left -= (x.mins || 45);
      if (x.type==='paper'){ skipped.add('paper:'+x.sid); S.log.push({d:today, t:'paper', s:x.sid, c:[], r:[]}); continue; }
      x.cards.forEach(id => skipped.add(id));
      S.log.push({d:today, t:x.type, s:CARD[x.cards[0]].sid, c:x.cards, r:[], mins:x.mins, cm:x.cm});
    }
  } finally { S = keepS; skipped = keepSkip; skipDay = keepSkipDay; }
  return out;
}
function todayListHTML(info){
  const today = todayStr(); const done = S.log.filter(l => l.d===today);
  const left = Math.max(0, info.target - doneOn(today) - (current ? (current.mins || 45) : 0));
  todayRest = mixDay(restOfToday(left), startKind(today, current));
  if (!done.length && !current && !todayRest.length && info.target===0) return '';
  const row = (n, cls, extra) => { const L = sessLabel(n); return `<li class="tl ${cls}"><details class="sx"><summary><div class="wk-k">${esc(L.k)}</div><div class="wk-sub">${esc(L.s)}</div><div class="wk-t">${esc(L.t)}</div></summary>${sessDetail(n)}</details>${extra||''}</li>`; };
  const items = done.map(l => row(l.t==='paper' ? {type:'paper', sid:l.s, cards:[]} : {type:l.t, cards:l.c, mins:l.mins, cm:l.cm}, 'done', `<span class="tl-tag">✓ ${l.r && l.r.length ? l.r.map(x => `<i class="rag ${lvClass(x)}"></i>`).join('') : ''}</span>`))
    .concat(current ? [row(current, 'now', '<span class="tl-tag now">Now</span>')] : [])
    .concat(todayRest.map((n, i) => row(n, '', `<button class="btn small" data-pick="${i}">Do this now</button>`)));
  return `<section class="panel tlist"><div class="row" style="justify-content:space-between"><h2>Today's sessions</h2><span class="small muted">${fmtMin(doneOn(today))} of ${fmtMin(info.target)}</span></div>
    <ol class="tl-list">${items.join('')}</ol>
    <div class="row" style="justify-content:space-between"><p class="small muted" style="margin:0;flex:1 1 220px">Do them in any order. The ones after "Now" can change once you rate a session.</p>
      <div class="row">${quickNext() ? '<button class="btn small" data-quick="1">+ Quick 5 min</button>' : ''}<button class="btn small" data-addsess="1">+ Add 45 min</button></div></div></section>`;
}

/* ---------- progress timeline ---------- */
let tlSubj = 'all', tlRange = 'month', tlMetric = 'conf';
try { tlSubj = localStorage.getItem('gcse-tl-subj') || 'all'; tlRange = localStorage.getItem('gcse-tl-range') || 'month'; tlMetric = localStorage.getItem('gcse-tl-metric') || 'conf'; } catch(e){}
const tlEnd = () => { const t = todayStr(); if (tlRange!=='exam') return t; const e = tlSubj==='all' ? CURRICULUM.map(x => examFirst(x.id)).sort()[0] : examFirst(tlSubj); return e && e > t ? e : t; };
const tlMock = () => { const m = tlSubj==='all' ? CURRICULUM.map(x => mockFirst(x.id)).filter(Boolean).sort()[0] : mockFirst(tlSubj); return m; };
const tlKey = () => tlMetric==='work' ? 'w_' + tlSubj : tlSubj;
const tlNow = () => { const cards = tlSubj==='all' ? CURRICULUM.flatMap(x => x.cards) : SUBJ[tlSubj].cards; return tlMetric==='work' ? workOf(cards, true).pct : progressOf(cards); };
function timelineSeries(){
  const today = todayStr(); const start = S.settings.startedOn;
  const from = tlRange==='week' ? addDays(today,-6) : tlRange==='month' ? addDays(today,-29) : start;
  const keys = Object.keys(S.hist||{}).sort();
  const pts = []; let last = null; let ki = 0;
  const key = tlKey();
  while (ki < keys.length && keys[ki] < from){ const v0 = S.hist[keys[ki]][key]; if (v0!=null) last = v0; ki++; }
  const end = tlEnd();     // "To exams" runs the axis on to the first exam; days after today stay empty
  for (let d = from; d <= end; d = addDays(d,1)){
    if (d > today){ pts.push({d, v:null, future:true}); continue; }
    while (ki < keys.length && keys[ki] <= d){ const v = S.hist[keys[ki]][key]; if (v!=null) last = v; ki++; }
    let v = d===today ? tlNow() : (d < start ? null : last);
    pts.push({d, v});
  }
  return pts;
}
function timelineHTML(){
  return `<section class="panel" id="tlpanel"><div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><h2 id="tltitle">${tlMetric==='work' ? 'Learning done' : 'Confidence'} over time</h2><span class="small muted" id="tldelta"></span></div>
      <div class="row tl-ctrl"><div class="seg" role="group" aria-label="Measure">${[['conf','Confidence'],['work','Learning done']].map(([v,l]) => `<button data-tlm="${v}" aria-pressed="${tlMetric===v}">${l}</button>`).join('')}</div><select id="tlsubj" aria-label="Subject"><option value="all">Everything</option>${CURRICULUM.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
        <div class="seg" role="group" aria-label="Time range">${[['week','Week'],['month','Month'],['all','Since start'],['exam','To exams']].map(([v,l]) => `<button data-tlr="${v}" aria-pressed="${tlRange===v}">${l}</button>`).join('')}</div></div></div>
    <div class="tl-chart" id="tlchart"></div></section>`;
}
function drawTimeline(){
  const host = document.getElementById('tlchart'); if (!host) return;
  const sel = document.getElementById('tlsubj'); if (sel) sel.value = tlSubj;
  const pts = timelineSeries(); const W = Math.max(280, host.clientWidth), H = 220, m = {l:40, r:46, t:12, b:26};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const x = i => m.l + (pts.length===1 ? iw/2 : iw * i/(pts.length-1)); const y = v => m.t + ih * (1 - v/100);
  const vals = pts.map((p,i) => ({...p, i})).filter(p => p.v!=null);
  const first = vals[0], lastP = vals[vals.length-1];
  const dl = document.getElementById('tldelta');
  if (dl && first && lastP){ const dv = lastP.v - first.v; dl.textContent = `${tlSubj==='all' ? 'All subjects' : SUBJ[tlSubj].name}: ${lastP.v}% now · ` + (vals.length < 2 ? 'the line builds up from today' : `${dv>=0?'+':''}${dv} points ${tlRange==='week'?'in the last 7 days':tlRange==='month'?'in the last 30 days':'since you started'}`); }
  const grid = [0,25,50,75,100].map(v => `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`).join('');
  const ti = pts.findIndex(p => p.d===todayStr()); const lastI = pts.length-1;
  const toEx = tlRange==='exam';

function quoteOf(d){ const n = diff('2026-01-01', d); return QUOTES[((n % QUOTES.length) + QUOTES.length) % QUOTES.length]; }
function periodStats(from, to){
  const today = todayStr(); let planned=0, plannedLeft=0, done=0;
  for (let d=from; d<=to; d=addDays(d,1)){
    const t = dayInfo(d).target; const dn = doneOn(d);
    if (d < S.settings.startedOn){ done += dn; continue; }
    planned += Math.max(t, d < today ? dn : t);
    if (d > today) plannedLeft += t; else if (d===today) plannedLeft += Math.max(0, t-dn);
    done += dn;
  }
  return {planned, done, left: plannedLeft};
}
function streak(){
  let n = 0; const today = todayStr();
  if (doneOn(today) >= dayInfo(today).target && dayInfo(today).target>0) n++;
  for (let d = addDays(today,-1); d >= S.settings.startedOn; d = addDays(d,-1)){
    const t = dayInfo(d).target; if (t===0) continue;
    if (doneOn(d) >= t) n++; else break;
  }
  return n;
}

    <div class="small muted">${st.left ? `${fmtMin(st.left)} left` : st.planned ? 'All done' : 'Nothing planned'}</div></div>`;
}

  const pctDone = info.target ? Math.min(100, Math.round(100*done/info.target)) : 0;
  const toMocks = s.mocks ? diff(today, s.mocks.from) : -1;
  const firstExam = Object.values(s.exams).sort()[0];
  const chips = [toMocks>0 ? `<span class="chip">Mocks in <b>${toMocks}</b> days</span>` : '',
                 firstExam && diff(today, firstExam)>0 ? `<span class="chip">Exams in <b>${diff(today, firstExam)}</b> days</span>` : ''].join('');
  // on a day with no study time the box below already says so: no date strip
  let html = info.target===0 ? '' : `<section class="today">
      <div><div class="eyebrow">${esc(fmtDay(today))} · ${esc(info.label)}</div>
        ${info.target ? `<div class="timebar" aria-label="${fmtMin(done)} of ${fmtMin(info.target)} studied"><div class="tb"><i style="width:${pctDone}%"></i></div><span class="small"><b>${fmtMin(done)}</b> of ${fmtMin(info.target)} studied</span></div>` : '<span class="small muted">No study time planned today</span>'}
        ${suggestedTimes(info)}</div>
</section>`;

  html = (S.settings.routine ? checkinHTML() : '') + html + setupPanel();
  html += '<div class="cols"><div class="main">';
  if (choosing) html += chooserHTML();
  if (!current){
    const restDay = info.target===0;
    const reached = done>=info.target && info.target>0;
    if ((restDay || reached) && !window.__anyway){
      html += `<section class="session"><div class="head"><div class="eyebrow">${restDay?'Day off':'Done for today'}</div>
        <h2 class="topic">${info.skippedDay ? 'Skipped today.' : restDay ? esc(info.label)+'.' : 'Goal reached.'}</h2>
        <p class="muted" style="margin:0">${info.skippedDay ? 'No problem. Anything that was due today moves to the front of the queue next time you study.' : restDay ? 'No revision planned today. Enjoy it.' : `You studied ${fmtMin(done)} today. Your brain stores it while you rest.`}</p></div>
        <div class="row">${info.skippedDay ? '<button class="btn small" id="ovundo2">Undo, I can study today</button>' : restDay
          ? `<span class="small muted">Skip it and study instead:</span><button class="btn primary small" data-ov="45">45 min</button><button class="btn small" data-ov="90">1h 30m</button><button class="btn small" data-ov="135">2h 15m</button>`
          : `<span class="small muted">In the mood for more?</span>${quickNext() ? '<button class="btn primary" data-quick="1">Quick refresher · 5 min</button>' : ''}<button class="btn" data-extra="refresh">Refresh · about 20 min</button><button class="btn" data-extra="revise">Revise · 20 to 45 min</button>`}<button class="btn ghost" data-choose="1">Let me choose a topic</button></div></section>`;
    } else {
      const plan = window.__anyway ? [] : restOfToday(Math.max(0, info.target - done));
      const n = mixDay(plan, startKind(today))[0] || pickNext();
      if (!n){
        html += `<section class="session"><div class="head"><div class="eyebrow">Nothing scheduled</div><h2 class="topic">Rate your topics to get started.</h2>
          <p class="muted" style="margin:0">Every rated topic you haven't mastered becomes a session. Go to Subjects and rate one.</p></div>
          <div class="row"><a class="btn primary" href="#topics" style="text-decoration:none">Rate topics</a><button class="btn ghost" data-choose="1">Let me choose a topic</button></div></section>`;
      } else {
        current = {type:n.type, cards:n.cards, sid:n.sid, mins:n.mins, cm:n.cm, phase:'work', ratings:{}, pr:{}};
        resetTimer();
      }
    }
  }
  if (info.override && !info.skippedDay) html += `<div class="row small muted" style="margin:-4px 0 10px">${esc(info.baseLabel)} normally has ${info.baseTarget ? fmtMin(info.baseTarget) : 'no study time'}. <button class="btn small ghost" id="ovundo">Undo</button></div>`;
  if (current) html += sessionHTML();
  if (current && info.target>0 && !info.override && done < info.target) html += `<div class="row" style="justify-content:center;margin-top:10px"><button class="btn small ghost" id="skipday">I can't study today</button></div>`;
  html += '</div><div class="side">' + todayListHTML(info) + '</div></div>' + weekHTML();
  $('#view').innerHTML = html;
  bindNext();
}

      <div class="multi">${cards.map(c => `<div class="mcard"><div class="kind" style="justify-content:space-between"><span class="kind"><span class="rag ${lvClass(cs(c.id).lvl)}"></span><span class="subj">${icon(c.sid,16)}${esc(SUBJ[c.sid].name)}</span></span><span class="chip">${cur.cm && cur.cm[c.id] != null ? cur.cm[c.id] : refMin(c.id)} min</span></div>

        <div class="allrow" data-id="${c.id}">Set all: ${[3,2.5,2,1.5,1].map(v => `<button class="${lvClass(v)}" data-all="${v}" title="${LVNAME[v]}">${LVNAME[v]}</button>`).join('')}</div>

function allRated(cards){ return cards.every(c => c.p.every((_,i) => current.pr[pk(c.id,i)]!=null)); }

/* a bonus 5-minute refresher: the next topic coming up for a refresher that isn't planned today, 5-minute ones first */
function quickNext(){
  const today = todayStr();
  const busy = new Set(S.log.filter(l => l.d===today).flatMap(l => l.c || []).concat(current ? current.cards : [], (todayRest||[]).flatMap(n => n.cards || [])));
  const c = liveSubjects(today).flatMap(sb => sb.cards).filter(c => cs(c.id).st==='review' && !busy.has(c.id))
    .sort((a,b) => (refMin(a.id)===5 ? 0 : 1) - (refMin(b.id)===5 ? 0 : 1) || (cs(a.id).due < cs(b.id).due ? -1 : 1))[0];
  return c ? {type:'quick', cards:[c.id], mins:5, cm:{[c.id]:5}} : null;
}
function startQuick(){
  const n = quickNext(); if (!n) return false;
  current = {type:'quick', cards:n.cards, mins:5, cm:n.cm, phase:'work', ratings:{}, pr:{}, extra:true};
  resetTimer(); render(); window.scrollTo({top:0, behavior:'smooth'}); return true;
}
/* pick any topic yourself */
let choosing = false, chooseSid = null;
function chooseStatus(id){
  const x = cs(id);
  if (x.st==='unrated') return 'not rated';
  if (x.st==='later') return 'not taught yet';
  if (x.st==='off') return 'off';
  const lv = x.lvl!=null ? LVNAME[snap(x.lvl)] : '';
  return lv + (x.st==='review' ? ' · refreshing' : x.st==='learning' ? ' · revise again' : ' · to revise');
}

function setupPanel(){

    <p class="small muted" style="margin:0">Pick the subjects you take in Settings, then rate the topics. After that the planner tells you what to do every day.</p>

  const todo = CURRICULUM.map(s => ({s, n: s.cards.filter(c => cs(c.id).st==='unrated').length})).filter(x => x.n);

}

function pacePanel(){
  const p = pace(); const ok = p.need*45 <= p.cap;
  return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>${ok ? 'On track' : 'Tight'}</h2><span class="small muted">up to ${esc(fmtShort(p.end))}</span></div>

      <div class="stat"><div class="n">${Math.round(p.cap/60)}h</div><div class="l">study time in your plan</div></div>
      <div class="stat"><div class="n">${Math.round(p.learnNeed*45/60)}h</div><div class="l">revising needed</div></div>
      <div class="stat"><div class="n">${Math.round(p.reviewNeed*45/60)}h</div><div class="l">refreshers needed (estimate)</div></div></div>
    ${ok ? '' : `<p class="small note" style="margin:0">Your plan is about ${Math.round((p.need*45-p.cap)/60)} hours short. Add study time on some weekdays or holiday days in Settings, or the scheduler will cut down the refreshers of your strongest topics first.</p>`}
    ${p.unrated ? `<p class="small muted" style="margin:0">Includes a guess for ${p.unrated} topics you haven't rated yet.</p>` : ''}</section>`;

function bindNext(){
  bindHabits();
  document.querySelectorAll('#view [data-wkov]').forEach(b => b.onclick = () => setOverride(b.dataset.wkov, b.dataset.n==='' ? null : +b.dataset.n));
  const wk = (f) => () => { f(); const y = window.scrollY; render(); window.scrollTo(0, y); };
  const wp = $('#wkprev'); if (wp) wp.onclick = wk(() => weekOffset--);
  const wn = $('#wknext'); if (wn) wn.onclick = wk(() => { const lastEx = CURRICULUM.map(x => examLast(x.id)).sort().pop(); if (weekOffset < Math.max(8, Math.ceil(diff(mondayOf(todayStr()), lastEx)/7))) weekOffset++; });
  const w0 = $('#wknow'); if (w0) w0.onclick = wk(() => weekOffset = 0);
  document.querySelectorAll('#view [data-choose]').forEach(b => b.onclick = () => { choosing = true; render(); const el = $('#chooser'); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); });
  { const cc = $('#chclose'); if (cc) cc.onclick = () => { choosing = false; render(); };

    const go = $('#chgo'); if (go) go.onclick = () => { const id = $('#chc').value; if (!CARD[id]) return;
      if (current && current.type!=='paper') current.cards.forEach(x => skipped.delete(x));
      const m = learnMin(id);
      current = {type:'learn', cards:[id], mins:m, phase:'work', ratings:{}, pr:{}, chosen:true};
      choosing = false; resetTimer(); render(); window.scrollTo({top:0, behavior:'smooth'}); }; }
  document.querySelectorAll('#view [data-pick]').forEach(b => b.onclick = () => {
    const n = todayRest[+b.dataset.pick]; if (!n) return;
    if (current && current.type!=='paper') current.cards.forEach(id => skipped.delete(id));
    current = {type:n.type, cards:n.cards, sid:n.sid, mins:n.mins, cm:n.cm, phase:'work', ratings:{}, pr:{}}; resetTimer(); render(); window.scrollTo({top:0, behavior:'smooth'}); });
  const on = (id, f) => { const el=document.getElementById(id); if (el) el.onclick=f; };
  on('anyway', () => { window.__anyway = true; render(); });
  on('ovundo', () => setOverride(todayStr(), null));
  document.querySelectorAll('#view [data-extra]').forEach(b => b.onclick = () => {
    const n = pickNext(b.dataset.extra);
    if (!n){ b.textContent = b.dataset.extra==='refresh' ? 'Nothing to refresh yet' : 'Nothing left to revise'; b.disabled = true; return; }
    current = {type:n.type, cards:n.cards, sid:n.sid, mins:n.mins, cm:n.cm, phase:'work', ratings:{}, pr:{}, extra:true}; resetTimer(); render(); });
  document.querySelectorAll('#view [data-addsess]').forEach(b => b.onclick = () => { const t = todayStr(); const keep = current;
    setOverride(t, Math.max(dayInfo(t).target, doneOn(t)) + 45); if (keep) { current = keep; render(); } });
  on('ovundo2', () => setOverride(todayStr(), null));
  on('skipday', () => { stopTimer(); setOverride(todayStr(), doneOn(todayStr())); });
  document.querySelectorAll('#view [data-ov]').forEach(b => b.onclick = () => setOverride(todayStr(), +b.dataset.ov));
  on('tgo', toggleTimer);
  on('finish', () => { current.phase='rate'; stopTimer(); render(); window.scrollTo({top:0,behavior:'smooth'}); });
  on('back', () => { current.phase='work'; render(); });
  on('swap', () => { if (current.type==='paper') skipped.add('paper:'+current.sid); current.cards.forEach(id => skipped.add(id)); current=null; render(); });
  { const nt = document.getElementById('note'); if (nt) nt.oninput = () => { if (current) current.note = nt.value; }; }
  document.querySelectorAll('[data-todo]').forEach(t => t.oninput = () => { if (current){ current.todo = current.todo || {}; current.todo[t.dataset.todo] = t.value; } });
  on('paperdone', () => { const at = new Date().toISOString(); S.log.push({d:todayStr(), at, t:'paper', s:current.sid, c:[], r:[], prev:{}, mins:45}); keepNote(at);
    current = null; window.__anyway = false; stopTimer(); save(); window.scrollTo({top:0,behavior:'smooth'}); });
  on('later', () => { setRating(current.cards[0], 'later'); current=null; render(); });
  const keep = f => { const y = window.scrollY; f(); render(); window.scrollTo(0, y); };
  document.querySelectorAll('#view .pr').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => keep(() => { current.pr[g.dataset.k] = +b.dataset.v; })));
  document.querySelectorAll('#view .allrow').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => keep(() => {
    const c = CARD[g.dataset.id]; c.p.forEach((_,i) => current.pr[pk(c.id,i)] = +b.dataset.all); })));
  on('save', () => doSave());
  on('saveq', () => { doSave(); if (!startQuick()) render(); });
  document.querySelectorAll('#view [data-quick]').forEach(b => b.onclick = () => { if (!startQuick()){ b.textContent = 'Nothing to refresh yet'; b.disabled = true; } });
}
function keepNote(at){ const t = (current && current.note || '').trim(); if (t) S.notes[at] = t;
  // to-do lists for the next refresher, per topic (an emptied box clears it)
  if (current && current.todo) Object.keys(current.todo).forEach(id => { const v = current.todo[id].trim(); if (v) S.todo[id] = v; else delete S.todo[id]; }); }
function doSave(){
  {
    const today = todayStr(); const prev = {};
    const prevPts = {};
    current.cards.forEach(id => { const c = CARD[id];
      c.p.forEach((_,i) => { const k = pk(id,i); prevPts[k] = S.pts[k]!=null ? S.pts[k] : null; S.pts[k] = current.pr[k]; });
      current.ratings[id] = deriveR(c.p.map((_,i) => current.pr[pk(id,i)])) || 2;
      prev[id] = S.cards[id] ? JSON.parse(JSON.stringify(S.cards[id])) : null; rateCard(id, toR3(current.ratings[id]), current.type, today, current.ratings[id]); });
    const relearnFlag = current.type==='learn' && !!prev[current.cards[0]] && prev[current.cards[0]].st==='learning';
    const at = new Date().toISOString(); keepNote(at);
    S.log.push({d:today, at, t:current.type, s:CARD[current.cards[0]].sid, c:current.cards, r:current.cards.map(id=>current.ratings[id]), mins: current.mins, cm: current.cm, prev, prevPts, ...(relearnFlag?{relearn:true}:{})});

/* week forecast: replay the scheduler on a copy of your progress, assuming learn sessions come out amber and reviews green */
function forecast(untilDay){

        if (n.type==='paper'){ S.log.push({d, t:'paper', s:n.sid, c:[], r:[], mins:45}); continue; }

    total += doneOn(d) + plan.reduce((x,n) => x + (n.mins || 45), 0);
    const item = (n, r, planned) => { const L = sessLabel(n);
      // colour = confidence: the rating you gave if done, otherwise the topic's current level
      const v = r && r.length && r[0]!=null ? r[0] : (n.cards && n.cards.length ? cs(n.cards[0]).lvl : null);
      const lc = v==null ? 'var(--grey)' : 'var(--lv' + String(snap(v)).replace('.','') + ')';
      return `<li class="wk-s ${planned?'planned':''} t-${n.type}" style="border-left-color:${lc}">${isRef(n) ? '' : '<details class="sx"><summary>'}<div class="wk-k">${planned ? '' : '<span class="wk-tick" title="Done" aria-label="Done">✓</span>'}${esc(L.k)}${r && r.length ? ' '+r.map(x => `<i class="rag ${lvClass(x)}"></i>`).join('') : ''}</div><div class="wk-sub">${esc(L.s)}</div><div class="wk-t">${esc(L.t)}</div>${isRef(n) ? '' : `</summary>${sessDetail(n)}</details>`}</li>`; };
    // refresher packs are listed card by card
    const split = (n, r) => (n.type==='review' || n.type==='quick') && n.cards.length > 1
      ? n.cards.map((id, i) => { const m = n.cm && n.cm[id] != null ? n.cm[id] : refMin(id); return {n:{type:n.type, cards:[id], mins:m, cm:{[id]:m}}, r: r && r[i] != null ? [r[i]] : null}; })
      : [{n, r}];
    const dm = doneOn(d);
    const missed = '';   // no 'not done' line: past days only show what was done
    return `<div class="wk-day ${d===today?'is-today':''} ${info.target===0?'is-off':''}">
      <div class="wk-h"><span class="wk-dn">${esc(parse(d).toLocaleDateString('en-GB',{weekday:'short',timeZone:'UTC'}))}</span> <span class="wk-dd">${esc(fmtShort(d))}</span>
        <div class="wk-l">${esc(info.label)}</div>${papersOn(d).map(x => `<div class="wk-ex ${x.k}">${x.k==='exam' ? 'Exam' : 'Mock'} · ${esc(SUBJ[x.sid].name)} ${esc(x.n.split(':')[0])}</div>`).join('')}<div class="wk-time">${info.target ? (d <= today && dm ? `${fmtMin(dm)} of ${fmtMin(info.target)}` : fmtMin(info.target)) : (dm ? fmtMin(dm) : 'No study time')}</div>
        ${d >= today ? (info.override
          ? `<button class="wk-ov" data-wkov="${d}" data-n="">Undo change</button>`
          : info.target===0 ? `<button class="wk-ov" data-wkov="${d}" data-n="90">Study instead</button>` : `<button class="wk-ov" data-wkov="${d}" data-n="0">Skip day</button>`) : ''}</div>
      <ul>${done.flatMap(x => split(x.n, x.r)).map(x => item(x.n, x.r, false)).join('')}${plan.flatMap(n => split(n, null)).map(x => item(x.n, null, true)).join('')}${missed}${!done.length && !plan.length && !missed ? `<li class="wk-free">${info.target===0 ? 'Free' : d < today ? '' : 'Nothing due'}</li>` : ''}</ul></div>`;
  }).join('');
  return `<section class="panel"><div class="row" style="justify-content:space-between">
      <h2>Week of ${esc(fmtShort(mon))}</h2>
      <div class="row"><button class="btn small ghost" id="wkprev" aria-label="Previous week">←</button><button class="btn small ghost" id="wknow">This week</button><button class="btn small ghost" id="wknext" aria-label="Next week">→</button></div></div>
    <p class="small muted" style="margin:0">The colour on the left of each box is how confident you are in that topic (your rating, from dark green to red). Solid boxes are sessions you've done. Dashed boxes are the forecast: the schedule re-plans after every rating, so these will shift. ${fmtMin(total)} of study this week.</p>
    <div class="wk">${cols}</div></section>`;
}

async function callFn(name, body){

  return data;
