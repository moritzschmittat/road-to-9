  try { localStorage.removeItem(LS); } catch(e){}   // nothing left behind on a shared computer
  if (liveChannel) sb.removeChannel(liveChannel);
  await sb.auth.signOut().catch(() => {});
  location.hash = ''; location.reload();
}
function startApp(user){
  USER = user; LS = 'roadto9:' + user.id;
  document.body.classList.remove('signedout');
  try { S = normalise(JSON.parse(localStorage.getItem(LS)||'null')); } catch(e){ S = fresh(); }
  lastSnap = clone(S);
  $('#footacct').innerHTML = `<button id="footsignout">Sign out</button>`; $('#footsignout').onclick = () => signOut();
  if (/access_token|error_description|type=/.test(location.hash)) history.replaceState(null, '', location.pathname + (DELETE_CONFIRMED ? '#plan' : '#next'));
  if (location.search) history.replaceState(null, '', location.pathname + location.hash);   // drop ?join= once signed in
  render(); connect();
}
/* ---------- onboarding: welcome → subjects → rate every topic → study time ---------- */
// Terms of use version. Change it when terms.html changes in a way that matters: everyone is asked to agree again.
const TERMS_V = '2026-11-13.2';
const termsOK = () => !!(S.settings.terms && S.settings.terms.v === TERMS_V);
function acceptTerms(){ S.settings.terms = {v: TERMS_V, at: new Date().toISOString()}; }
const TERMS_TICK = `<label class="obterms"><input type="checkbox" id="obterms"> <span>I’m 13 or over, I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of use</a> and have read the <a href="privacy.html" target="_blank" rel="noopener">Privacy note</a>. If I’m under 18, a parent or carer knows I’m using Road to 9.</span></label>`;
const OB_STEPS = [['welcome','You'],['subjects','Subjects'],['rate','Rate topics'],['time','Study time']];
const OB_LEVELS = [
  [1,'Very strong','I could answer exam questions on it now'],
  [1.5,'Strong','I know it well, with small gaps'],
  [2,'OK','I know the basics'],
  [2.5,'Weak','I’ve seen it but couldn’t explain it'],
  [3,'Very weak','I don’t really know it']];
function obSet(patch){ S.settings.ob = Object.assign({}, S.settings.ob, patch); save(); }
function rateChunk(id, v){
  if (typeof v === 'number') CARD[id].p.forEach((_, j) => { S.pts[pk(id, j)] = v; });
  setRating(id, v);
}
function chunkChoice(id){ const x = cs(id); return x.st==='later' ? 'later' : x.st==='off' ? 'off' : x.st==='unrated' ? null : x.lvl; }
function renderOnboarding(){
  document.body.classList.add('onboarding');
  const ob = S.settings.ob, s = S.settings, step = ob.step;
  const idx = OB_STEPS.findIndex(x => x[0]===step);
  const steps = `<ol class="obsteps">${OB_STEPS.map(([k, l], i) => `<li class="${i < idx ? 'done' : i===idx ? 'now' : ''}"><span>${i+1}</span>${l}</li>`).join('')}</ol>`;
  let body = '';
  if (step==='welcome'){
    body = `<h1>Welcome to Road to <span>9</span></h1>
      <p class="lead">We do the planning, you do the learning. Three quick steps and your first session is ready.</p>
      <ol class="obhow"><li><b>Pick your subjects.</b></li><li><b>Rate every topic</b> from very strong to very weak. Be honest: the weakest come first.</li><li><b>Open Road to 9 each day</b> and do what it says. It plans revising, and brings topics back just before you’d forget them.</li></ol>
      <label class="small muted" for="obname">First name or nickname (optional)<input id="obname" value="${esc(s.name||'')}" maxlength="30" autocomplete="given-name"></label>
      ${TERMS_TICK}
      <div class="obnav"><span></span><button class="btn primary" id="obnext">Let’s start</button></div><div id="obmsg" class="small" role="status"></div>
      <details class="obimport"><summary class="small">Already have a progress file from an earlier planner?</summary>
        <p class="small muted">Tick the box above first, then load it to skip these steps. Everything in it (subjects, ratings, sessions, journal) comes across.</p>
        <label class="btn small" for="obfile" style="cursor:pointer">Choose file</label><input id="obfile" type="file" accept=".json,application/json" hidden>
        <div id="obimpmsg" class="small" role="status"></div></details>`;
  } else if (step==='subjects'){
    body = `<h1>Which subjects do you take?</h1>
      <p class="lead">Tick each one. Check the exam board with your school if you’re not sure.</p>
      <div class="subjpick">${ALL_SUBJECTS.map(x => `<label><input type="checkbox" data-obsubj="${x.id}" ${s.subjects.includes(x.id) ? 'checked' : ''}><span>${icon(x.id,16)} <b>${esc(x.name)}</b><small>${esc(x.board)}</small></span></label>`).join('')}</div>
      <p class="small muted">Missing a subject or exam board? Tell the person who invited you; more are being added.</p>
      <div class="obnav"><button class="btn ghost" id="obback">Back</button><button class="btn primary" id="obnext">Next</button></div><div id="obmsg" class="small" role="status"></div>`;
  } else if (step==='rate'){
    const subs = CURRICULUM; const i = Math.min(ob.i||0, subs.length-1); const sb = subs[i];
    const rated = sb.cards.filter(c => chunkChoice(c.id)!=null).length;
    const secs = []; sb.cards.forEach(c => { let g = secs[secs.length-1]; if (!g || g.name!==c.sec){ g = {name:c.sec, cards:[]}; secs.push(g); } g.cards.push(c); });
    body = `<div class="obsubj">${iconTile(sb.id, 22)}<div><div class="eyebrow">Subject ${i+1} of ${subs.length}</div><h1>${esc(sb.name)}</h1><div class="small muted">${esc(sb.board)}</div></div></div>
      <p class="lead">How well do you know each topic right now? Tap one colour per topic.</p>
      <div class="oblegend">${[...OB_LEVELS].reverse().map(([v, n, d]) => `<div><i class="rag ${lvClass(v)}"></i><b>${n}</b><span>${d}</span></div>`).join('')}
        <div><i class="rag lv-x"></i><b>Not taught yet</b><span>We haven’t covered it at school</span></div></div>
      <div class="obprog"><div class="bar"><i style="width:${Math.round(100*rated/sb.cards.length)}%"></i></div><span class="small muted">${rated} of ${sb.cards.length} topics rated</span></div>
      ${secs.map(g => `<section class="obsec"><div class="obsech"><h2>${esc(g.name)}</h2><button class="linkbtn" data-obsec="${esc(g.cards.map(c => c.id).join(','))}">Not taught yet: whole section</button></div>
        <ul class="obrows">${g.cards.map(c => { const v = chunkChoice(c.id); return `<li><div class="obt"><b>${esc(c.n)}</b><ul class="obpts ${v==='later'||v==='off' ? 'dim' : ''}">${c.p.map((q, j) => { const pv = ptLvl(c, j);
            return `<li><span class="code">${esc(q.c)}</span><span class="tx">${esc(q.t)}</span><span class="obpb" role="group" aria-label="Rate ${esc(q.c)}">${[...OB_LEVELS].reverse().map(([lv, n]) => `<button class="obp ${lvClass(lv)}" data-obp="${pk(c.id, j)}" data-v="${lv}" aria-pressed="${pv===lv}" title="${n}" aria-label="${esc(q.c)}: ${n}"></button>`).join('')}</span></li>`; }).join('')}</ul></div>
          <div class="obbtns" role="group" aria-label="${esc(c.n)}">
            <button class="obtx" data-obr="${c.id}" data-v="later" aria-pressed="${v==='later'}">Not taught yet</button>
            <button class="obtx" data-obr="${c.id}" data-v="off" aria-pressed="${v==='off'}" title="Not part of my course">Not on my course</button></div></li>`; }).join('')}</ul></section>`).join('')}
      <div class="obnav"><button class="btn ghost" id="obback">Back</button><button class="btn primary" id="obnext">${i+1 < subs.length ? 'Next subject' : 'Next'}</button></div>
      <div id="obmsg" class="small" role="status"></div>`;
  } else {
    const wd = s.week[1], we = s.week[6];
    const chips = (name, opts, cur) => `<div class="chips obchips">${opts.map(m => `<button class="chip" data-obt="${name}" data-m="${m}" aria-pressed="${cur===m}">${m < 60 ? m + ' min' : (m/60) + (m===60 ? ' hour' : ' hours')}</button>`).join('')}</div>`;
    body = `<h1>How much time can you study?</h1>
      <p class="lead">A rough guide is fine. You can set each day, holidays, mocks and exam dates in Settings later.</p>
      <h2>On a school day</h2>${chips('wd', [30,45,60,90,120], wd)}
      <h2>On a weekend day</h2>${chips('we', [60,90,120,180,240], we)}
      <p class="small muted">Exam dates are filled in from the 2027 timetables for your subjects. Check them in Settings once your school confirms.</p>
      <div class="obnav"><button class="btn ghost" id="obback">Back</button><button class="btn primary" id="obnext">Show my first session</button></div>`;
  }
  $('#view').innerHTML = `<div class="ob">${steps}${body}</div>`;
  const go = (step, i) => { obSet({step, i: i||0}); window.scrollTo({top:0}); };
  const back = $('#obback'); if (back) back.onclick = () => {
    if (step==='rate' && (ob.i||0) > 0) return go('rate', ob.i - 1);
    go(OB_STEPS[Math.max(0, idx-1)][0], step==='time' ? CURRICULUM.length-1 : 0); };
  $('#obnext').onclick = () => {
    if (step==='welcome'){
      if (!$('#obterms').checked){ $('#obmsg').textContent = 'Please tick the box to agree to the Terms of use first.'; return; }
      acceptTerms(); s.name = ($('#obname').value||'').trim().slice(0,30); return go('subjects'); }
    if (step==='subjects'){
      const pick = [...document.querySelectorAll('[data-obsubj]')].filter(x => x.checked).map(x => x.dataset.obsubj);
      if (!pick.length){ $('#obmsg').textContent = 'Tick at least one subject.'; return; }
      s.subjects = pick; return go('rate', 0);
    }
    if (step==='rate'){
      const i = ob.i||0; const sb = CURRICULUM[i]; const left = sb.cards.filter(c => chunkChoice(c.id)==null).length;
      if (left && !ob.warned){ $('#obmsg').innerHTML = `${left} topic${left===1?'':'s'} not rated yet. They won’t be planned until you rate them (you can do that later on the Subjects page). <button class="linkbtn" id="obanyway">Continue anyway</button>`;
        $('#obanyway').onclick = () => { S.settings.ob.warned = true; $('#obnext').click(); }; return; }
      S.settings.ob.warned = false;
      return i+1 < CURRICULUM.length ? go('rate', i+1) : go('time');
    }
    s.onboarded = true; s.ob = {step:'done', i:0}; s.startedOn = todayStr(); location.hash = '#next'; save();
  };
  const f = $('#obfile'); if (f) f.onchange = async () => {
    const file = f.files && f.files[0]; if (!file) return; const m = $('#obimpmsg');
    if (!$('#obterms').checked){ m.textContent = '⚠ Tick the box to agree to the Terms of use first, then choose the file again.'; f.value = ''; return; }
    const res = checkImport(await file.text());
    if (res.err){ m.textContent = '⚠ ' + res.err; return; }
    const d = normalise(res.d); delete d.app; delete d.exportedAt; d.settings.onboarded = true; d.settings.ob = {step:'done', i:0};
    d.settings.terms = {v: TERMS_V, at: new Date().toISOString()};
    if (!d.settings.subjects.length) d.settings.subjects = ALL_SUBJECTS.map(q => q.id);
    S = d; current = null; location.hash = '#next'; save();
  };
  document.querySelectorAll('[data-obr]').forEach(b => b.onclick = () => { const v = b.dataset.v; rateChunk(b.dataset.obr, isNaN(+v) ? v : +v); });
  document.querySelectorAll('[data-obp]').forEach(b => b.onclick = () => applyPoint(b.dataset.obp, +b.dataset.v));
  document.querySelectorAll('[data-obsec]').forEach(b => b.onclick = () => { b.dataset.obsec.split(',').forEach(id => { if (chunkChoice(id)==null) setRating(id, 'later'); }); });
  document.querySelectorAll('[data-obt]').forEach(b => b.onclick = () => { const m = +b.dataset.m;
    if (b.dataset.obt==='wd') [1,2,3,4,5].forEach(d => s.week[d] = m); else [0,6].forEach(d => s.week[d] = m); save(); });
}
const _render = render;
render = function(){ if (!USER){ return; } applySubjects();
  if (!S.settings.onboarded){ renderOnboarding(); return; }
  if (!termsOK()){ renderTermsGate(); return; }
  document.body.classList.remove('onboarding'); _render(); };
function renderTermsGate(){
  document.body.classList.add('onboarding');
  $('#view').innerHTML = `<div class="ob"><h1>${S.settings.terms ? 'We’ve updated our terms' : 'One quick thing'}</h1>
    <p class="lead">Please agree to the Terms of use before you carry on. Your planner is exactly as you left it.</p>
    ${TERMS_TICK}<div class="obnav"><span></span><button class="btn primary" id="obnext">Continue</button></div><div id="obmsg" class="small" role="status"></div></div>`;
  $('#obnext').onclick = () => { if (!$('#obterms').checked){ $('#obmsg').textContent = 'Please tick the box first.'; return; } acceptTerms(); save(); render(); };
}
window.addEventListener('hashchange', () => { if (USER) render(); });
(async function boot(){
  if (!window.supabase || SB_URL.startsWith('%%')){ renderLogin('⚠ The site isn’t connected to its database yet.'); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  const errHash = /error_description=([^&]+)/.exec(location.hash);
  // Email links carry a one-time token_hash. Mail scanners open links to check them, so nothing is
  // used up until the person presses Continue.
  const hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get('token_hash')){ renderContinue(hp.get('token_hash'), hp.get('type') || 'magiclink'); return; }
  const {data} = await sb.auth.getSession();
  if (data && data.session) startApp(data.session.user);
  else renderLogin(errHash ? '⚠ ' + decodeURIComponent(errHash[1].replace(/\+/g, ' ')) + '. Ask for a new link below.' : '');
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'SIGNED_IN' && session && !USER) startApp(session.user);
    if (ev === 'SIGNED_OUT' && USER){ USER = null; renderLogin(''); }
  });
})();
