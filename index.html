<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road to 9</title>
<meta name="description" content="Road to 9: the GCSE revision planner. We do the planning, you do the learning.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column, one "next session" card that owns the screen; everything else is quiet and secondary. */
:root{
  --blue:#1f6fb2; --blue-soft:#dcebf9;
  --bg:#eef2f5; --surface:#ffffff; --sunk:#e4e9ee; --refbg:#ffffff; --revbg:#f6f8fa; --ink:#13202b; --muted:#566775; --line:#d3dbe2;
  --accent:#1f45d6; --accent-ink:#ffffff; --accent-soft:#e3e9ff;
  --red:#d33f3f; --amber:#d98e0b; --green:#23925a; --grey:#a2adb7;
  --red-soft:#fbe5e5; --amber-soft:#fdf0d6; --green-soft:#ddf3e6;
  --f-display:"Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body:"Manrope", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --blue:#7fb8ea; --blue-soft:#16314a;
  --bg:#0c1218; --surface:#141c24; --sunk:#1b252f; --refbg:#223040; --revbg:#141c24; --ink:#e6edf3; --muted:#93a4b3; --line:#26333f;
  --accent:#7d96ff; --accent-ink:#0c1218; --accent-soft:#1d2747;
  --red:#ef6a6a; --amber:#f0b23c; --green:#49c27b; --grey:#5c6a76;
  --red-soft:#3a1d20; --amber-soft:#3a2c12; --green-soft:#163222; color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#7fb8ea; --blue-soft:#16314a;
  --bg:#0c1218; --surface:#141c24; --sunk:#1b252f; --refbg:#223040; --revbg:#141c24; --ink:#e6edf3; --muted:#93a4b3; --line:#26333f;
  --accent:#7d96ff; --accent-ink:#0c1218; --accent-soft:#1d2747;
  --red:#ef6a6a; --amber:#f0b23c; --green:#49c27b; --grey:#5c6a76;
  --red-soft:#3a1d20; --amber-soft:#3a2c12; --green-soft:#163222; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:none;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* online / offline indicator */
.netpill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;font-size:13px;font-weight:800;color:#fff;letter-spacing:.01em}
.netpill i{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.netpill.ok{background:var(--lv1)}
.netpill.off{background:var(--lv3)}
.netpill.saving{background:var(--lv25);color:#13202b}
.netpill.saving i{background:#13202b;box-shadow:none;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.netpill.saving i{animation:none}}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--f-display);font-weight:600;font-size:23px;letter-spacing:-.01em}
.brand span{color:var(--accent);font-style:italic}
nav{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
nav a{text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px}
nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.sync{font-size:12px;color:var(--muted);text-align:right;min-height:16px}

/* today strip */
.today{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:6px 0 14px}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:inline-block}
.dot.on{background:var(--accent)}
.dot.extra{border-style:dashed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink)}

/* the session card */
.session{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 20px;display:grid;gap:16px;box-shadow:0 8px 28px -18px rgba(20,32,43,.35)}
.session .head{display:grid;gap:6px}
.kind{display:inline-flex;gap:8px;align-items:center}
.subj{font-size:15px;font-weight:700;color:var(--accent)}
.topic{font-size:clamp(28px,6vw,42px);font-weight:600;letter-spacing:-.015em}
.sec{font-size:14px;color:var(--muted)}
.rag{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.rag.r{background:var(--red)}.rag.a{background:var(--amber)}.rag.g{background:var(--green)}.rag.x{background:var(--grey)}
.points{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.points li{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:start;font-size:15px}
.points li .rag{margin-top:5px}
.points .code{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px;min-width:3.6em}
.points li.focus{font-weight:700}
.points li.rated{grid-template-columns:auto auto minmax(0,1fr) auto}
.pr{display:flex;gap:4px}
.pr button{width:26px;height:26px;border-radius:6px;border:0;padding:0;opacity:.35;cursor:pointer}
.pr button:hover{opacity:.7}
.pr button[aria-pressed="true"]{opacity:1;outline:2.5px solid var(--ink);outline-offset:1px}
.rag.lv-x{background:var(--grey)}
.allrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.allrow button{border:0;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;cursor:pointer}
@media (max-width:520px){.points li.rated{grid-template-columns:auto auto minmax(0,1fr)} .points li.rated .pr{grid-column:3}}
.multi{display:grid;gap:12px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.mcard h3{font-size:18px}
.mcard .points li{font-size:14px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-weight:700;font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.steps b{display:block}
.steps span{color:var(--muted);font-size:14px}

.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:12px 14px}
.clock{font-family:var(--f-mono);font-weight:700;font-size:40px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:4.2ch}
.bar{flex:1 1 120px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s linear}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--sunk);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

/* rating */
.rate{display:grid;gap:12px}
.rateitem{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--sunk)}
.rateitem .t{font-weight:700}
.rb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rb button{border:2px solid transparent;border-radius:10px;padding:10px 6px;font-weight:700;font-size:14px;line-height:1.2}
.rb .r{background:var(--red-soft);color:var(--red)} .rb .a{background:var(--amber-soft);color:var(--amber)} .rb .g{background:var(--green-soft);color:var(--green)}
.rb button[aria-pressed="true"]{border-color:currentColor}
.rb small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;margin-top:14px}
.panel h2{font-size:18px}
.note{border-left:3px solid var(--amber);padding-left:12px}
.pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat .n{font-family:var(--f-display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}

/* topics */
.subjlist{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.srow .nm{font-weight:700}
.srow .meta{font-size:12px;color:var(--muted);text-align:right}
.stack{grid-column:1/-1;display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.cardrow{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.cardrow:first-of-type{border-top:0}
.cardrow .nm{font-weight:700}
.cardrow > div{min-width:0}
.cardrow .chip{white-space:normal;display:inline-block;margin-top:2px}
.cardrow .ctrl{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cardrow .ctrl button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}
.cardrow .ctrl button.r[aria-pressed="true"]{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.cardrow .ctrl button.a[aria-pressed="true"]{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.cardrow .ctrl button.g[aria-pressed="true"]{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.cardrow .ctrl button.o[aria-pressed="true"]{background:var(--sunk);color:var(--ink);border-color:var(--ink)}
.secthead{margin-top:18px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.status{font-size:12px;color:var(--muted)}

/* plan */
.wk{display:grid;grid-template-columns:1fr;gap:6px;margin-top:4px}
.wk-day{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:start}
.wk-day.is-today{outline:2px solid var(--accent)}
.wk-day.is-off{opacity:.75}
.wk-h{line-height:1.2}
.wk-dn{font-weight:600;font-family:var(--f-display);font-size:17px}
.wk-dd{font-size:12px;color:var(--muted)}
.wk-l{font-size:11px;color:var(--muted);margin-top:2px}
.wk-ex{font-size:11px;font-weight:700;margin-top:4px;padding:2px 6px;border-radius:6px;background:var(--sunk);color:var(--ink);display:inline-block}
.wk-ex.exam{background:var(--lv3);color:#fff}
.wk-day ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.wk-s{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:7px;padding:5px 6px;font-size:12px;min-width:0}
.wk-s.t-review{border-left-color:var(--green)}
.wk-s.t-paper{border-left-color:var(--amber)}
.wk-s.planned{border-style:dashed;border-left-style:solid;background:transparent}
.wk-s:not(.planned){background:var(--revbg)}
/* refreshers: a brighter box so they stand out from revise sessions */
.wk-s.t-review,.wk-s.t-quick,.wk-s.planned.t-review,.wk-s.planned.t-quick{background:var(--refbg)}
.wk-k{font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.wk-k .rag{width:8px;height:8px}
.wk-sub{font-weight:700}
.wk-t{color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wk-miss{font-size:12px;color:var(--red)}
.wk-tick{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--lv1);color:#fff;font-size:10px;font-weight:800;margin-right:5px;vertical-align:-2px}
.wk-ov{margin-top:6px;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:7px;padding:3px 8px;font-size:11px;font-weight:700}
.wk-free{font-size:12px;color:var(--muted)}
@media (max-width:520px){.wk-day{grid-template-columns:84px minmax(0,1fr)}.wk-day ul{grid-template-columns:1fr}}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.grid7 label{display:grid;gap:4px;font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.grid7 input{font-variant-numeric:tabular-nums}
.minf{position:relative;display:block;min-width:0}
.minf input{width:100%;padding-right:38px;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.minf input::-webkit-inner-spin-button,.minf input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.minf i{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;font-weight:600;color:var(--muted);pointer-events:none}
@media (max-width:640px){.grid7{grid-template-columns:repeat(4,minmax(0,1fr))}}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0;width:100%}
.periods{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 92px 32px;gap:6px;align-items:center}
.prow .x,.paprow .x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
.exams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px);gap:6px 10px;align-items:center}
.papgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px;margin-top:12px}
.papsub{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.paph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.paprow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) 28px;gap:6px;align-items:center}
.paphead{font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.papsub [data-addpaper]{align-self:flex-start}
@media (max-width:520px){.paprow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 24px;gap:4px}.paprow .pn{grid-column:1/-1;margin-top:4px}.paprow input[type=date]{padding:7px 4px;font-size:14px}.paphead span:first-child{display:none}.papsub{padding:10px 8px}}
.hist{display:grid;gap:6px;font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
@media (max-width:520px){
  .session{padding:18px 16px}
  .prow{grid-template-columns:1fr 1fr;}
  .prow input:first-child{grid-column:1/-1}
  .clock{font-size:34px}
}
/* subject board: one column per section, like the spreadsheet */
:root{--lv1:#1e8a4c;--lv15:#8cc84b;--lv2:#f2cf1d;--lv25:#f39a1e;--lv3:#d63a3a;--lvx:var(--sunk);--cell-ink:#13202b}
.bhead-top{display:flex;justify-content:flex-start;gap:16px 28px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.bhead-top > .pctbox{margin-left:auto}
.key{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.key span{display:inline-flex;gap:5px;align-items:center}
.cellkey{display:inline-grid;place-items:center;width:26px;height:20px;border-radius:4px;font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:700}
.lv-1{background:var(--lv1);color:#fff}.lv-15{background:var(--lv15);color:var(--cell-ink)}.lv-2{background:var(--lv2);color:var(--cell-ink)}.lv-25{background:var(--lv25);color:var(--cell-ink)}.lv-3{background:var(--lv3);color:#fff}.lv-x{background:var(--lvx);color:var(--muted)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(340px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;align-items:start;margin-top:8px}
.bcol{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;display:grid;align-content:start}
.bcol-h{position:sticky;top:0;padding:12px 14px;border-bottom:2px solid var(--ink);display:grid;gap:6px;background:var(--surface);border-radius:12px 12px 0 0}
.bsec{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.2}
.bchunk{padding:10px 14px 12px;border-top:1px solid var(--line);display:grid;gap:6px}
.bchunk:first-of-type{border-top:0}
.bchunk.dim{opacity:.55}
.bch-h{display:flex;gap:8px;align-items:center}
.optchip{white-space:normal;display:inline-block;max-width:100%;border-radius:8px;line-height:1.35}
.bch-h .nm{font-weight:700}
.bpts{display:grid;gap:2px}
.bpt{display:grid;grid-template-columns:var(--codew,3.6em) minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px;line-height:1.35;padding:3px 0}
.bpt .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.cell{width:40px;height:28px;border:0;border-radius:5px;cursor:pointer}
.cell.lv-x,.cellkey.lv-x{background:transparent;border:1.5px dashed var(--grey)}
.cell[aria-expanded="true"]{outline:2px solid var(--accent);outline-offset:1px}
.swatches{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;padding:2px 0 6px}
.swatches button{width:36px;height:26px;border:0;border-radius:5px;font-family:var(--f-mono);font-weight:700;font-size:11px}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink)}
.swatches .clr{width:auto;padding:0 8px;background:var(--sunk);color:var(--muted);font-family:var(--f-body);font-size:12px}
.studybtn{margin-left:auto;background:var(--accent)!important;color:var(--accent-ink)!important;padding:6px 12px!important;font-size:13px!important;border-radius:10px!important}
.bch-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bch-f .ctrl{display:flex;gap:4px}
.bch-f .ctrl button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.bch-f .ctrl button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);border-color:var(--ink)}
.histbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:2px 4px;margin-left:auto;margin-right:6px}

/* ===== Road to 9 look (logo colours: deep navy + lime) ===== */
:root{
  --navy:#0b2c4f; --navy-2:#123d6b; --lime:#b6f738; --lime-2:#a3e626; --night:#050c14;
  --mark-a:#123d6b; --mark-b:#a8ea2c;
  --bg:#f3f6f9; --surface:#ffffff; --sunk:#eaeff4; --revbg:#f7f9fb; --ink:#0a1a2b; --muted:#5a6b7c; --line:#dfe6ed;
  --accent:#0f3561; --accent-ink:#ffffff; --accent-soft:#e4edf7;
  --f-display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(10,26,43,.04),0 10px 30px -12px rgba(10,26,43,.12);
  --ring:0 0 0 4px rgba(163,230,38,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --mark-a:#1f5a96; --mark-b:#b6f738;
  --bg:#050c14; --surface:#0c1724; --sunk:#132233; --revbg:#0e1a28; --ink:#eaf0f6; --muted:#97a8ba; --line:#1c2d40;
  --accent:#b6f738; --accent-ink:#06111d; --accent-soft:#1c2a10; --shadow:0 1px 0 rgba(255,255,255,.03),0 12px 32px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --mark-a:#1f5a96; --mark-b:#b6f738;
  --bg:#050c14; --surface:#0c1724; --sunk:#132233; --revbg:#0e1a28; --ink:#eaf0f6; --muted:#97a8ba; --line:#1c2d40;
  --accent:#b6f738; --accent-ink:#06111d; --accent-soft:#1c2a10; --shadow:0 1px 0 rgba(255,255,255,.03),0 12px 32px -14px rgba(0,0,0,.6); color-scheme:dark}
h1,h2,h3{font-family:var(--f-display);font-weight:650;letter-spacing:-.02em}
.top{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.02em;font-style:normal}
.brand .mark{width:30px;height:30px}
.brand b,.wm b{color:var(--accent);font-style:normal}
.brand span{color:inherit;font-style:normal}
nav{background:var(--sunk);border:1px solid var(--line)}
nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.panel{border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.btn{border-radius:12px;padding:12px 20px;transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
.btn.primary{background:linear-gradient(180deg,var(--navy-2),var(--navy));color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 8px 20px -10px rgba(11,44,79,.7)}
.btn.primary:hover{transform:translateY(-1px)}
:root[data-theme="dark"] .btn.primary{background:var(--lime);color:var(--night);box-shadow:0 8px 24px -12px rgba(182,247,56,.7)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--lime);color:var(--night);box-shadow:0 8px 24px -12px rgba(182,247,56,.7)}}
.btn.ghost{border-radius:12px}
input,select{border-radius:12px;padding:10px 12px;transition:border-color .12s ease,box-shadow .12s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-2);box-shadow:var(--ring)}
input[type=checkbox],input[type=radio]{accent-color:var(--navy-2)}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input[type=checkbox]{accent-color:var(--lime)}}

/* onboarding: one calm card */
.ob{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:clamp(20px,4vw,40px);margin-top:18px}
.ob h1{font-size:clamp(28px,4.5vw,40px);letter-spacing:-.025em}

.obnav{background:linear-gradient(to top,var(--surface) 70%,transparent)}
.obhow li::marker{font-weight:700;color:var(--accent)}
.obsec,.oblegend,.subjpick label{border-radius:14px}

  background:radial-gradient(900px 520px at 50% -8%,rgba(182,247,56,.16),transparent 62%),radial-gradient(800px 600px at 15% 110%,rgba(31,90,150,.35),transparent 60%),#050c14;min-height:100vh;color-scheme:dark}

const ALL_SUBJECTS = [{"id":"bio","name":"Biology","board":"Edexcel IGCSE 4BI1","spec":"https://qualifications.pearson.com/content/dam/pdf/International%20GCSE/Biology/2017/specification-and-sample-assessments/international-gcse-biology-2017-specification1.pdf","cards":[{"id":"bio-1.1","g":"Characteristics of living organisms","n":"Characteristics of living organisms","sec":"The nature and variety of living organisms","k":"content","p":[{"c":"1.1","t":"Understand how living organisms share the following characteristics: • they require nutrition • they respire • they excrete their waste • they respond to their surroundings • they move • they control their internal conditions • they reproduce • they grow and develop."}]},{"id":"bio-1.2","g":"Variety of living organisms","n":"Variety of living organisms","sec":"The nature and variety of living organisms","k":"content","p":[{"c":"1.2","t":"Describe the common features shown by eukaryotic organisms: plants, animals, fungi and protoctists"},{"c":"1.3","t":"Describe the common features shown by prokaryotic organisms such as bacteria"},{"c":"1.4","t":"Understand the term pathogen and know that pathogens may include fungi, bacteria, protoctists or viruses"}]},{"id":"bio-2.1","g":"Level of organisation","n":"Level of organisation","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.1","t":"Describe the levels of organisation in organisms: organelles, cells, tissues, organs and systems"}]},{"id":"bio-2.2","g":"Cell structure","n":"Cell structure (1/2)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.2","t":"Describe cell structures, including the nucleus, cytoplasm, cell membrane, cell wall, mitochondria, chloroplasts, ribosomes and vacuole"},{"c":"2.3","t":"Describe the functions of the nucleus, cytoplasm, cell membrane, cell wall, mitochondria, chloroplasts, ribosomes and vacuole"},{"c":"2.4","t":"Know the similarities and differences in the structure of plant and animal cells"}]},{"id":"bio-2.5B","g":"Cell structure","n":"Cell structure (2/2)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.5B","t":"Explain the importance of cell differentiation in the development of specialised cells"},{"c":"2.6B","t":"Understand the advantages and disadvantages of using stem cells in medicine"}]},{"id":"bio-2.7","g":"Biological molecules","n":"Biological molecules (1/2)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.7","t":"Identify the chemical elements present in carbohydrates, proteins and lipids (fats and oils)"},{"c":"2.8","t":"Describe the structure of carbohydrates, proteins and lipids as large molecules made up from smaller basic units: starch and glycogen from simple sugars, protein from amino acids, and lipid from fatty acids and glycerol"},{"c":"2.9","t":"Practical: investigate food samples for the presence of glucose, starch, protein and fat"},{"c":"2.10","t":"Understand the role of enzymes as biological catalysts in metabolic reactions"}]},{"id":"bio-2.11","g":"Biological molecules","n":"Biological molecules (2/2)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.11","t":"Understand how temperature changes can affect enzyme function, including changes to the shape of active site"},{"c":"2.12","t":"Practical: investigate how enzyme activity can be affected by changes in temperature"},{"c":"2.13","t":"Understand how enzyme function can be affected by changes in pH altering the active site"},{"c":"2.14B","t":"Practical: investigate how enzyme activity can be affected by changes in pH"}]},{"id":"bio-2.15","g":"Movement of substances into and out of cells","n":"Movement of substances into and out of cells","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.15","t":"Understand the processes of diffusion, osmosis and active transport by which substances move into and out of cells"},{"c":"2.16","t":"Understand how factors affect the rate of movement of substances into and out of cells, including the effects of surface area to volume ratio, distance, temperature and concentration gradient"},{"c":"2.17","t":"Practical: investigate diffusion and osmosis using living and non-living systems"}]},{"id":"bio-2.18","g":"Nutrition","n":"Nutrition (1/4)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.18","t":"Understand the process of photosynthesis and its importance in the conversion of light energy to chemical energy"},{"c":"2.19","t":"Know the word equation and the balanced chemical symbol equation for photosynthesis"},{"c":"2.20","t":"Understand how varying carbon dioxide concentration, light intensity and temperature affect the rate of photosynthesis"},{"c":"2.21","t":"Describe the structure of the leaf and explain how it is adapted for photosynthesis"}]},{"id":"bio-2.22","g":"Nutrition","n":"Nutrition (2/4)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.22","t":"Understand that plants require mineral ions for growth, and that magnesium ions are needed for chlorophyll and nitrate ions are needed for amino acids"},{"c":"2.23","t":"Practical: investigate photosynthesis, showing the evolution of oxygen from a water plant, the production of starch and the requirements of light, carbon dioxide and chlorophyll"},{"c":"2.24","t":"Understand that a balanced diet should include appropriate proportions of carbohydrate, protein, lipid, vitamins, minerals, water and dietary fibre"},{"c":"2.25","t":"Identify the sources and describe the functions of carbohydrate, protein, lipid (fats and oils), vitamins A, C and D, the mineral ions calcium and iron, water and dietary fibre as components of the diet"}]},{"id":"bio-2.26","g":"Nutrition","n":"Nutrition (3/4)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.26","t":"Understand how energy requirements vary with activity levels, age and pregnancy"},{"c":"2.27","t":"Describe the structure and function of the human alimentary canal, including the mouth, oesophagus, stomach, small intestine (duodenum and ileum), large intestine (colon and rectum) and pancreas"},{"c":"2.28","t":"Understand how food is moved through the gut by peristalsis"},{"c":"2.29","t":"Understand the role of digestive enzymes, including the digestion of starch to glucose by amylase and maltase, the digestion of proteins to amino acids by proteases and the digestion of lipids to fatty acids and glycerol by lipases"}]},{"id":"bio-2.30","g":"Nutrition","n":"Nutrition (4/4)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.30","t":"Understand that bile is produced by the liver and stored in the gall bladder"},{"c":"2.31","t":"Understand the role of bile in neutralising stomach acid and emulsifying lipids"},{"c":"2.32","t":"Understand how the small intestine is adapted for absorption, including the structure of a villus"},{"c":"2.33B","t":"Practical: investigate the energy content in a food sample"}]},{"id":"bio-2.34","g":"Respiration","n":"Respiration (1/2)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.34","t":"Understand how the process of respiration produces ATP in living organisms"},{"c":"2.35","t":"Know that ATP provides energy for cells"},{"c":"2.36","t":"Describe the differences between aerobic and anaerobic respiration"}]},{"id":"bio-2.37","g":"Respiration","n":"Respiration (2/2)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.37","t":"Know the word equation and the balanced chemical symbol equation for aerobic respiration in living organisms"},{"c":"2.38","t":"Know the word equation for anaerobic respiration in plants and in animals"},{"c":"2.39","t":"Practical: investigate the evolution of carbon dioxide and heat from respiring seeds or other suitable living organisms"}]},{"id":"bio-2.40B","g":"Gas exchange","n":"Gas exchange (1/3)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.40B","t":"Understand the role of diffusion in gas exchange"},{"c":"2.41B","t":"Understand gas exchange (of carbon dioxide and oxygen) in relation to respiration and photosynthesis"},{"c":"2.42B","t":"Understand how the structure of the leaf is adapted for gas exchange"},{"c":"2.43B","t":"Describe the role of stomata in gas exchange"}]},{"id":"bio-2.44B","g":"Gas exchange","n":"Gas exchange (2/3)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.44B","t":"Understand how respiration continues during the day and night, but that the net exchange of carbon dioxide and oxygen depends on the intensity of light"},{"c":"2.45B","t":"Practical: investigate the effect of light on net gas exchange from a leaf, using hydrogen-carbonate indicator"},{"c":"2.46","t":"Describe the structure of the thorax, including the ribs, intercostal muscles, diaphragm, trachea, bronchi, bronchioles, alveoli and pleural membranes"},{"c":"2.47","t":"Understand the role of the intercostal muscles and the diaphragm in ventilation"}]},{"id":"bio-2.48","g":"Gas exchange","n":"Gas exchange (3/3)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.48","t":"Explain how alveoli are adapted for gas exchange by diffusion between air in the lungs and blood in capillaries"},{"c":"2.49","t":"Understand the biological consequences of smoking in relation to the lungs and the circulatory system, including coronary heart disease"},{"c":"2.50","t":"Practical: investigate breathing in humans, including the release of carbon dioxide and the effect of exercise"}]},{"id":"bio-2.51","g":"Transport","n":"Transport (1/5)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.51","t":"Understand why simple, unicellular organisms can rely on diffusion for movement of substances in and out of the cell"},{"c":"2.52","t":"Understand the need for a transport system in multicellular organisms"},{"c":"2.53","t":"Describe the role of phloem in transporting sucrose and amino acids between the leaves and other parts of the plant"},{"c":"2.54","t":"Describe the role of xylem in transporting water and mineral ions from the roots to other parts of the plant"}]},{"id":"bio-2.55B","g":"Transport","n":"Transport (2/5)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.55B","t":"Understand how water is absorbed by root hair cells"},{"c":"2.56B","t":"Understand that transpiration is the evaporation of water from the surface of a plant"},{"c":"2.57B","t":"Understand how the rate of transpiration is affected by changes in humidity, wind speed, temperature and light intensity"},{"c":"2.58B","t":"Practical: investigate the role of environmental factors in determining the rate of transpiration from a leafy shoot"}]},{"id":"bio-2.59","g":"Transport","n":"Transport (3/5)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.59","t":"Describe the composition of the blood: red blood cells, white blood cells, platelets and plasma"},{"c":"2.60","t":"Understand the role of plasma in the transport of carbon dioxide, digested food, urea, hormones and heat energy"},{"c":"2.61","t":"Understand how adaptations of red blood cells make them suitable for the transport of oxygen, including shape, the absence of a nucleus and the presence of haemoglobin"},{"c":"2.62","t":"Understand how the immune system responds to disease using white blood cells, illustrated by phagocytes ingesting pathogens and lymphocytes releasing antibodies specific to the pathogen"}]},{"id":"bio-2.63B","g":"Transport","n":"Transport (4/5)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.63B","t":"Understand how vaccination results in the manufacture of memory cells, which enable future antibody production to the pathogen to occur sooner, faster and in greater quantity"},{"c":"2.64B","t":"Understand how platelets are involved in blood clotting, which prevents blood loss and the entry of micro-organisms"},{"c":"2.65","t":"Describe the structure of the heart and how it functions"},{"c":"2.66","t":"Explain how the heart rate changes during exercise and under the influence of adrenaline"}]},{"id":"bio-2.67","g":"Transport","n":"Transport (5/5)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.67","t":"Understand how factors may increase the risk of developing coronary heart disease"},{"c":"2.68","t":"Understand how the structure of arteries, veins and capillaries relate to their function"},{"c":"2.69","t":"Understand the general structure of the circulation system, including the blood vessels to and from the heart and lungs, liver and kidneys"}]},{"id":"bio-2.70","g":"Excretion","n":"Excretion (1/3)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.70","t":"Understand the origin of carbon dioxide and oxygen as waste products of metabolism and their loss from the stomata of a leaf"},{"c":"2.71","t":"Know the excretory products of the lungs, kidneys and skin (organs of excretion)"},{"c":"2.72B","t":"Understand how the kidney carries out its roles of excretion and osmoregulation"},{"c":"2.73B","t":"Describe the structure of the urinary system, including the kidneys, ureters, bladder and urethra"}]},{"id":"bio-2.74B","g":"Excretion","n":"Excretion (2/3)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.74B","t":"Describe the structure of a nephron, including the Bowman’s capsule and glomerulus, convoluted tubules, loop of Henle and collecting duct"},{"c":"2.75B","t":"Describe ultrafiltration in the Bowman’s capsule and the composition of the glomerular filtrate"},{"c":"2.76B","t":"Understand how water is reabsorbed into the blood from the collecting duct"}]},{"id":"bio-2.77B","g":"Excretion","n":"Excretion (3/3)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.77B","t":"Understand why selective reabsorption of glucose occurs at the proximal convoluted tubule"},{"c":"2.78B","t":"Describe the role of ADH in regulating the water content of the blood"},{"c":"2.79B","t":"Understand that urine contains water, urea and ions"}]},{"id":"bio-2.80","g":"Coordination and response","n":"Coordination and response (1/4)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.80","t":"Understand how organisms are able to respond to changes in their environment"},{"c":"2.81","t":"Understand that homeostasis is the maintenance of a constant internal environment, and that body water content and body temperature are both examples of homeostasis"},{"c":"2.82","t":"Understand that a co-ordinated response requires a stimulus, a receptor and an effector"},{"c":"2.83","t":"Understand that plants respond to stimuli"}]},{"id":"bio-2.84","g":"Coordination and response","n":"Coordination and response (2/4)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.84","t":"Describe the geotropic and phototropic responses of roots and stems"},{"c":"2.85","t":"Understand the role of auxin in the phototropic response of stems"},{"c":"2.86","t":"Describe how nervous and hormonal communication control responses and understand the differences between the two systems"},{"c":"2.87","t":"Understand that the central nervous system consists of the brain and spinal cord and is linked to sense organs by nerves"}]},{"id":"bio-2.88","g":"Coordination and response","n":"Coordination and response (3/4)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.88","t":"Understand that stimulation of receptors in the sense organs sends electrical impulses along nerves into and out of the central nervous system, resulting in rapid responses"},{"c":"2.89","t":"Understand the role of neurotransmitters at synapses"},{"c":"2.90","t":"Describe the structure and functioning of a simple reflex arc illustrated by the withdrawal of a finger from a hot object"},{"c":"2.91","t":"Describe the structure and function of the eye as a receptor"}]},{"id":"bio-2.92","g":"Coordination and response","n":"Coordination and response (4/4)","sec":"Structure and functions in living organisms","k":"content","p":[{"c":"2.92","t":"Understand the function of the eye in focusing on near and distant objects, and in responding to changes in light intensity"},{"c":"2.93","t":"Describe the role of the skin in temperature regulation, with reference to sweating, vasoconstriction and vasodilation"},{"c":"2.94","t":"Understand the sources, roles and effects of the following hormones: adrenaline, insulin, testosterone, progesterone and oestrogen"},{"c":"2.95B","t":"Understand the sources, roles and effects of the following hormones: ADH, FSH and LH"}]},{"id":"bio-3.1","g":"Reproduction","n":"Reproduction (1/4)","sec":"Reproduction and inheritance","k":"content","p":[{"c":"3.1","t":"Understand the differences between sexual and asexual reproduction"},{"c":"3.2","t":"Understand that fertilisation involves the fusion of a male and female gamete to produce a zygote that undergoes cell division and develops into an embryo"},{"c":"3.3","t":"Describe the structures of an insect-pollinated and a wind-pollinated flower and explain how each is adapted for pollination"},{"c":"3.4","t":"Understand that the growth of the pollen tube followed by fertilisation leads to seed and fruit formation"}]},{"id":"bio-3.5","g":"Reproduction","n":"Reproduction (2/4)","sec":"Reproduction and inheritance","k":"content","p":[{"c":"3.5","t":"Practical: investigate the conditions needed for seed germination"},{"c":"3.6","t":"Understand how germinating seeds utilise food reserves until the seedling can carry out photosynthesis"},{"c":"3.7","t":"Understand that plants can reproduce asexually by natural methods (illustrated by runners) and by artificial methods (illustrated by cuttings)"}]},{"id":"bio-3.8","g":"Reproduction","n":"Reproduction (3/4)","sec":"Reproduction and inheritance","k":"content","p":[{"c":"3.8","t":"Understand how the structure of the male and female reproductive systems are adapted for their functions"},{"c":"3.9","t":"Understand the roles of oestrogen and progesterone in the menstrual cycle"},{"c":"3.10B","t":"Understand the roles of FSH and LH in the menstrual cycle"}]},{"id":"bio-3.11","g":"Reproduction","n":"Reproduction (4/4)","sec":"Reproduction and inheritance","k":"content","p":[{"c":"3.11","t":"Describe the role of the placenta in the nutrition of the developing embryo"},{"c":"3.12","t":"Understand how the developing embryo is protected by amniotic fluid"},{"c":"3.13","t":"Understand the roles of oestrogen and testosterone in the development of secondary sexual characteristics"}]},{"id":"bio-3.14","g":"Inheritance","n":"Inheritance (1/7)","sec":"Reproduction and inheritance","k":"content","p":[{"c":"3.14","t":"Understand that the genome is the entire DNA of an organism and that a gene is a section of a molecule of DNA that codes for a specific protein"},{"c":"3.15","t":"Understand that the nucleus of a cell contains chromosomes on which genes are located"},{"c":"3.16B","t":"Describe a DNA molecule as two strands coiled to form a double helix, the strands being linked by a series of paired bases: adenine (A) with thymine (T), and cytosine (C) with guanine (G)"},{"c":"3.17B","t":"Understand that an RNA molecule is single stranded and contains uracil (U) instead of thymine (T)"}]},{"id":"bio-3.18B","g":"Inheritance","n":"Inheritance (2/7)","sec":"Reproduction and inheritance","k":"content","p":[{"c":"3.18B","t":"Describe the stages of protein synthesis including transcription and translation, including the role of mRNA, ribosomes, tRNA, codons and anticodons"},{"c":"3.19","t":"Understand how genes exist in alternative forms called alleles which give rise to differences in inherited characteristics"},{"c":"3.20","t":"Understand the meaning of the terms: dominant, recessive, homozygous, heterozygous, phenotype, and genotype"},{"c":"3.21B","t":"Understand the meaning of the term codominance"}]},{"id":"bio-3.22","g":"Inheritance","n":"Inheritance (3/7)","sec":"Reproduction and inheritance","k":"content","p":[{"c":"3.22","t":"Understand that most phenotypic features are the result of polygenic inheritance rather than single genes"},{"c":"3.23","t":"Describe patterns of monohybrid inheritance using a genetic diagram"},{"c":"3.24","t":"Understand how to interpret family pedigrees"},{"c":"3.25","t":"Predict probabilities of outcomes from monohybrid crosses"}]},{"id":"bio-3.26","g":"Inheritance","n":"Inheritance (4/7)","sec":"Reproduction and inheritance","k":"content","p":[{"c":"3.26","t":"Understand how the sex of a person is controlled by one pair of chromosomes, XX in a female and XY in a male"},{"c":"3.27","t":"Describe the determination of the sex of offspring at fertilisation, using a genetic diagram"},{"c":"3.28","t":"Understand how division of a diploid cell by mitosis produces two cells that contain identical sets of chromosomes"},{"c":"3.29","t":"Understand that mitosis occurs during growth, repair, cloning and asexual reproduction"}]},{"id":"bio-3.30","g":"Inheritance","n":"Inheritance (5/7)","sec":"Reproduction and inheritance","k":"content","p":[{"c":"3.30","t":"Understand how division of a cell by meiosis produces four cells, each with half the number of chromosomes, and that this results in the formation of genetically different haploid gametes"},{"c":"3.31","t":"Understand how random fertilisation produces genetic variation of offspring"},{"c":"3.32","t":"Know that in human cells the diploid number of chromosomes is 46 and the haploid number is 23"},{"c":"3.33","t":"Understand that variation within a species can be genetic, environmental, or a combination of both"}]},{"id":"bio-3.34","g":"Inheritance","n":"Inheritance (6/7)","sec":"Reproduction and inheritance","k":"content","p":[{"c":"3.34","t":"Understand that mutation is a rare, random change in genetic material that can be inherited"},{"c":"3.35B","t":"Understand how a change in DNA can affect the phenotype by altering the sequence of amino acids in a protein"},{"c":"3.36B","t":"Understand how most genetic mutations have no effect on the phenotype, some have a small effect and rarely do they have a significant effect"}]},{"id":"bio-3.37B","g":"Inheritance","n":"Inheritance (7/7)","sec":"Reproduction and inheritance","k":"content","p":[{"c":"3.37B","t":"Understand that the incidence of mutations can be increased by exposure to ionising radiation (for example, gamma rays, x-rays and ultraviolet rays) and some chemical mutagens (for example, chemicals in tobacco)"},{"c":"3.38","t":"Explain Darwin’s theory of evolution by natural selection"},{"c":"3.39","t":"Understand how resistance to antibiotics can increase in bacterial populations, and appreciate how such an increase can lead to infections being difficult to control"}]},{"id":"bio-4.1","g":"The organism in the environment","n":"The organism in the environment (1/2)","sec":"Ecology and the environment","k":"content","p":[{"c":"4.1","t":"Understand the terms population, community, habitat and ecosystem"},{"c":"4.2","t":"Practical: investigate the population size of an organism in two different areas using quadrats"},{"c":"4.3B","t":"Understand the term biodiversity"}]},{"id":"bio-4.4B","g":"The organism in the environment","n":"The organism in the environment (2/2)","sec":"Ecology and the environment","k":"content","p":[{"c":"4.4B","t":"Practical: investigate the distribution of organisms in their habitats and measure biodiversity using quadrats"},{"c":"4.5","t":"Understand how abiotic and biotic factors affect the population size and distribution of organisms"}]},{"id":"bio-4.6","g":"Feeding relationships","n":"Feeding relationships","sec":"Ecology and the environment","k":"content","p":[{"c":"4.6","t":"Understand the names given to different trophic levels, including producers, primary, secondary and tertiary consumers and decomposers"},{"c":"4.7","t":"Understand the concepts of food chains, food webs, pyramids of number, pyramids of biomass and pyramids of energy transfer"},{"c":"4.8","t":"Understand the transfer of substances and energy along a food chain"},{"c":"4.9","t":"Understand why only about 10% of energy is transferred from one trophic level to the next"}]},{"id":"bio-4.10","g":"Cycles within ecosystems","n":"Cycles within ecosystems","sec":"Ecology and the environment","k":"content","p":[{"c":"4.10","t":"Describe the stages in the carbon cycle, including respiration, photosynthesis, decomposition and combustion"},{"c":"4.11B","t":"Describe the stages in the nitrogen cycle, including the roles of nitrogen fixing bacteria, decomposers, nitrifying bacteria and denitrifying bacteria (specific names of bacteria are not required)"}]},{"id":"bio-4.12","g":"Human influences on the environment","n":"Human influences on the environment (1/2)","sec":"Ecology and the environment","k":"content","p":[{"c":"4.12","t":"Understand the biological consequences of pollution of air by sulfur dioxide and carbon monoxide"},{"c":"4.13","t":"Understand that water vapour, carbon dioxide, nitrous oxide, methane and CFCs are greenhouse gases"},{"c":"4.14","t":"Understand how human activities contribute to greenhouse gases"},{"c":"4.15","t":"Understand how an increase in greenhouse gases results in an enhanced greenhouse effect and that this may lead to global warming and its consequences"}]},{"id":"bio-4.16","g":"Human influences on the environment","n":"Human influences on the environment (2/2)","sec":"Ecology and the environment","k":"content","p":[{"c":"4.16","t":"Understand the biological consequences of pollution of water by sewage"},{"c":"4.17","t":"Understand the biological consequences of eutrophication caused by leached minerals from fertiliser"},{"c":"4.18B","t":"Understand the effects of deforestation, including leaching, soil erosion, disturbance of evapotranspiration and the carbon cycle, and the balance of atmospheric gases"}]},{"id":"bio-5.1","g":"Food production","n":"Food production (1/3)","sec":"Use of biological resources","k":"content","p":[{"c":"5.1","t":"Describe how glasshouses and polythene tunnels can be used to increase the yield of certain crops"},{"c":"5.2","t":"Understand the effects on crop yield of increased carbon dioxide and increased temperature in glasshouses"},{"c":"5.3","t":"Understand how the use of fertiliser can increase crop yield"}]},{"id":"bio-5.4","g":"Food production","n":"Food production (2/3)","sec":"Use of biological resources","k":"content","p":[{"c":"5.4","t":"Understand the reasons for pest control and the advantages and disadvantages of using pesticides and biological control with crop plants"},{"c":"5.5","t":"Understand the role of yeast in the production of food including bread"},{"c":"5.6","t":"Practical: investigate the role of anaerobic respiration by yeast in different conditions"}]},{"id":"bio-5.7","g":"Food production","n":"Food production (3/3)","sec":"Use of biological resources","k":"content","p":[{"c":"5.7","t":"Understand the role of bacteria (Lactobacillus) in the production of yoghurt"},{"c":"5.8","t":"Understand the use of an industrial fermenter and explain the need to provide suitable conditions in the fermenter, including aseptic precautions, nutrients, optimum temperature and pH, oxygenation and agitation, for the growth of microorganisms"},{"c":"5.9B","t":"Understand the methods used to farm large numbers of fish to provide a source of protein, including maintaining water quality, controlling intraspecific and interspecific predation, controlling disease, removing waste products, controlling the quality and frequency of feeding, and selective breeding"}]},{"id":"bio-5.10","g":"Selective breeding","n":"Selective breeding","sec":"Use of biological resources","k":"content","p":[{"c":"5.10","t":"Understand how selective breeding can develop plants with desired characteristics"},{"c":"5.11","t":"Understand how selective breeding can develop animals with desired characteristics"}]},{"id":"bio-5.12","g":"Genetic modification","n":"Genetic modification (1/2)","sec":"Use of biological resources","k":"content","p":[{"c":"5.12","t":"Understand how restriction enzymes are used to cut DNA at specific sites and ligase enzymes are used to join pieces of DNA together"},{"c":"5.13","t":"Understand how plasmids and viruses can act as vectors, which take up pieces of DNA, and then insert this recombinant DNA into other cells"},{"c":"5.14","t":"Understand how large amounts of human insulin can be manufactured from genetically modified bacteria that are grown in a fermenter"}]},{"id":"bio-5.15","g":"Genetic modification","n":"Genetic modification (2/2)","sec":"Use of biological resources","k":"content","p":[{"c":"5.15","t":"Understand how genetically modified plants can be used to improve food production"},{"c":"5.16","t":"Understand that the term transgenic means the transfer of genetic material from one species to a different species"}]},{"id":"bio-5.17B","g":"Cloning","n":"Cloning","sec":"Use of biological resources","k":"content","p":[{"c":"5.17B","t":"Describe the process of micropropagation (tissue culture) in which explants are grown in vitro"},{"c":"5.18B","t":"Understand how micropropagation can be used to produce commercial quantities of genetically identical plants with desirable characteristics"},{"c":"5.19B","t":"Describe the stages in the production of cloned mammals involving the introduction of a diploid nucleus from a mature cell into an enucleated egg cell, illustrated by Dolly the sheep"},{"c":"5.20B","t":"Understand how cloned transgenic animals can be used to produce human proteins"}]}]},{"id":"chem","name":"Chemistry","board":"Edexcel IGCSE 4CH1","spec":"https://qualifications.pearson.com/content/dam/pdf/International%20GCSE/Chemistry/2017/specification-and-sample-assessments/international-gcse-chemistry-2017-specification.pdf","cards":[{"id":"chem-1.1","g":"States of matter","n":"States of matter (1/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.1","t":"Understand the three states of matter in terms of the arrangement, movement and energy of the particles"},{"c":"1.2","t":"Understand the interconversions between the three states of matter in terms of: • the names of the interconversions • how they are achieved • the changes in arrangement, movement and energy of the particles."},{"c":"1.3","t":"Understand how the results of experiments involving the dilution of coloured solutions and diffusion of gases can be explained"},{"c":"1.4","t":"Know what is meant by the terms: • solvent • solute • solution • saturated solution."}]},{"id":"chem-1.5C","g":"States of matter","n":"States of matter (2/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.5C","t":"Know what is meant by the term solubility in the units g per 100 g of solvent"},{"c":"1.6C","t":"Understand how to plot and interpret solubility curves"},{"c":"1.7C","t":"Practical: investigate the solubility of a solid in water at a specific temperature"}]},{"id":"chem-1.8","g":"Elements, compounds and mixtures","n":"Elements, compounds and mixtures (1/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.8","t":"Understand how to classify a substance as an element, compound or mixture"},{"c":"1.9","t":"Understand that a pure substance has a fixed melting and boiling point, but that a mixture may melt or boil over a range of temperatures"},{"c":"1.10","t":"Describe these experimental techniques for the separation of mixtures: • simple distillation • fractional distillation • filtration • crystallisation • paper chromatography."}]},{"id":"chem-1.11","g":"Elements, compounds and mixtures","n":"Elements, compounds and mixtures (2/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.11","t":"Understand how a chromatogram provides information about the composition of a mixture"},{"c":"1.12","t":"Understand how to use the calculation of Rf values to identify the components of a mixture"},{"c":"1.13","t":"Practical: investigate paper chromatography using inks/food colourings"}]},{"id":"chem-1.14","g":"Atomic structure","n":"Atomic structure","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.14","t":"Know what is meant by the terms atom and molecule"},{"c":"1.15","t":"Know the structure of an atom in terms of the positions, relative masses and relative charges of sub-atomic particles"},{"c":"1.16","t":"Know what is meant by the terms atomic number, mass number, isotopes and relative atomic mass (Ar)"},{"c":"1.17","t":"Be able to calculate the relative atomic mass of an element (Ar) from isotopic abundances"}]},{"id":"chem-1.18","g":"Periodic table","n":"Periodic table (1/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.18","t":"Understand how elements are arranged in the Periodic Table: • in order of atomic number • in groups and periods."},{"c":"1.19","t":"Understand how to deduce the electronic configurations of the first 20 elements from their positions in the Periodic Table"},{"c":"1.20","t":"Understand how to use electrical conductivity and the acid-base character of oxides to classify elements as metals or non-metals"},{"c":"1.21","t":"Identify an element as a metal or a non-metal according to its position in the Periodic Table"}]},{"id":"chem-1.22","g":"Periodic table","n":"Periodic table (2/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.22","t":"Understand how the electronic configuration of a main group element is related to its position in the Periodic Table"},{"c":"1.23","t":"Understand why elements in the same group of the Periodic Table have similar chemical properties"},{"c":"1.24","t":"Understand why the noble gases (Group 0) do not readily react"}]},{"id":"chem-1.25","g":"Chemical formulae, equations and calculations","n":"Chemical formulae, equations and calculations (1/3)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.25","t":"Write word equations and balanced chemical equations (including state symbols): • for reactions studied in this specification • for unfamiliar reactions where suitable information is provided."},{"c":"1.26","t":"Calculate relative formula masses (including relative molecular masses) (Mr) from relative atomic masses (Ar)"},{"c":"1.27","t":"Know that the mole (mol) is the unit for the amount of a substance"},{"c":"1.28","t":"Understand how to carry out calculations involving amount of substance, relative atomic mass (Ar) and relative formula mass (Mr)"}]},{"id":"chem-1.29","g":"Chemical formulae, equations and calculations","n":"Chemical formulae, equations and calculations (2/3)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.29","t":"Calculate reacting masses using experimental data and chemical equations"},{"c":"1.30","t":"Calculate percentage yield"},{"c":"1.31","t":"Understand how the formulae of simple compounds can be obtained experimentally, including metal oxides, water and salts containing water of crystallisation"},{"c":"1.32","t":"Know what is meant by the terms empirical formula and molecular formula"}]},{"id":"chem-1.33","g":"Chemical formulae, equations and calculations","n":"Chemical formulae, equations and calculations (3/3)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.33","t":"Calculate empirical and molecular formulae from experimental data"},{"c":"1.34C","t":"Understand how to carry out calculations involving amount of substance, volume and concentration (in mol/dm3) of solution"},{"c":"1.35C","t":"Understand how to carry out calculations involving gas volumes and the molar volume of a gas (24 dm3 and 24 000 cm3 at room temperature and pressure (rtp))"},{"c":"1.36","t":"Practical: know how to determine the formula of a metal oxide by combustion (e.g. magnesium oxide) or by reduction (e.g. copper(II) oxide)"}]},{"id":"chem-1.37","g":"Ionic bonding","n":"Ionic bonding (1/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.37","t":"Understand how ions are formed by electron loss or gain"},{"c":"1.38","t":"Know the charges of these ions: • metals in Groups 1, 2 and 3 • non-metals in Groups 5, 6 and 7 • Ag+, Cu2+, Fe2+, Fe3+, Pb2+, Zn2+ • hydrogen (H+), hydroxide (OH–), ammonium (NH4+), carbonate (CO32–), nitrate (NO3-), sulfate (SO42–)."},{"c":"1.39","t":"Write formulae for compounds formed between the ions listed above"},{"c":"1.40","t":"Draw dot-and-cross diagrams to show the formation of ionic compounds by electron transfer, limited to combinations of elements from Groups 1, 2, 3 and 5, 6, 7 only outer electrons need be shown"}]},{"id":"chem-1.41","g":"Ionic bonding","n":"Ionic bonding (2/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.41","t":"Understand ionic bonding in terms of electrostatic attractions"},{"c":"1.42","t":"Understand why compounds with giant ionic lattices have high melting and boiling points"},{"c":"1.43","t":"Know that ionic compounds do not conduct electricity when solid, but do conduct electricity when molten and in aqueous solution"}]},{"id":"chem-1.44","g":"Covalent bonding","n":"Covalent bonding (1/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.44","t":"Know that a covalent bond is formed between atoms by the sharing of a pair of electrons"},{"c":"1.45","t":"Understand covalent bonds in terms of electrostatic attractions"},{"c":"1.46","t":"Understand how to use dot-and-cross diagrams to represent covalent bonds in: • diatomic molecules, including hydrogen, oxygen, nitrogen, halogens and hydrogen halides • inorganic molecules including water, ammonia and carbon dioxide • organic molecules containing up to two carbon atoms, including methane, ethane, ethene and those containing halogen atoms."},{"c":"1.47","t":"Explain why substances with a simple molecular structures are gases or liquids, or solids with low melting and boiling points the term intermolecular forces of attraction can be used to represent all forces between molecules"}]},{"id":"chem-1.48","g":"Covalent bonding","n":"Covalent bonding (2/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.48","t":"Explain why the melting and boiling points of substances with simple molecular structures increase, in general, with increasing relative molecular mass"},{"c":"1.49","t":"Explain why substances with giant covalent structures are solids with high melting and boiling points"},{"c":"1.50","t":"Explain how the structures of diamond, graphite and C60 fullerene influence their physical properties, including electrical conductivity and hardness"},{"c":"1.51","t":"Know that covalent compounds do not usually conduct electricity"}]},{"id":"chem-1.52C","g":"Metallic bonding","n":"Metallic bonding","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.52C","t":"Know how to represent a metallic lattice by a 2-D diagram"},{"c":"1.53C","t":"Understand metallic bonding in terms of electrostatic attractions"},{"c":"1.54C","t":"Explain typical physical properties of metals, including electrical conductivity and malleability"}]},{"id":"chem-1.55C","g":"Electrolysis","n":"Electrolysis (1/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.55C","t":"Understand why covalent compounds do not conduct electricity"},{"c":"1.56C","t":"Understand why ionic compounds conduct electricity only when molten or in aqueous solution"},{"c":"1.57C","t":"Know that anion and cation are terms used to refer to negative and positive ions respectively"}]},{"id":"chem-1.58C","g":"Electrolysis","n":"Electrolysis (2/2)","sec":"Principles of Chemistry","k":"content","p":[{"c":"1.58C","t":"Describe experiments to investigate electrolysis, using inert electrodes, of molten compounds (including lead(II) bromide) and aqueous solutions (including sodium chloride, dilute sulfuric acid and copper(II) sulfate) and to predict the products"},{"c":"1.59C","t":"Write ionic half-equations representing the reactions at the electrodes during electrolysis and understand why these reactions are classified as oxidation or reduction"},{"c":"1.60C","t":"Practical: investigate the electrolysis of aqueous solutions"}]},{"id":"chem-2.1","g":"Group 1 - alkali metals","n":"Group 1 - alkali metals","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.1","t":"Understand how the similarities in the reactions of these elements with water provide evidence for their recognition as a family of elements"},{"c":"2.2","t":"Understand how the differences between the reactions of these elements with air and water provide evidence for the trend in reactivity in Group 1"},{"c":"2.3","t":"Use knowledge of trends in Group 1 to predict the properties of other alkali metals"},{"c":"2.4C","t":"Explain the trend in reactivity in Group 1 in terms of electronic configurations"}]},{"id":"chem-2.5","g":"Group 7 - halogens","n":"Group 7 - halogens","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.5","t":"Know the colours, physical states (at room temperature) and trends in physical properties of these elements"},{"c":"2.6","t":"Use knowledge of trends in Group 7 to predict the properties of other halogens"},{"c":"2.7","t":"Understand how displacement reactions involving halogens and halides provide evidence for the trend in reactivity in Group 7"},{"c":"2.8C","t":"Explain the trend in reactivity in Group 7 in terms of electronic configurations"}]},{"id":"chem-2.9","g":"Gases in the atmosphere","n":"Gases in the atmosphere (1/2)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.9","t":"Know the approximate percentages by volume of the four most abundant gases in dry air"},{"c":"2.10","t":"Understand how to determine the percentage by volume of oxygen in air using experiments involving the reactions of metals (e.g. iron) and non-metals (e.g. phosphorus) with air"},{"c":"2.11","t":"Describe the combustion of elements in oxygen, including magnesium, hydrogen and sulfur"}]},{"id":"chem-2.12","g":"Gases in the atmosphere","n":"Gases in the atmosphere (2/2)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.12","t":"Describe the formation of carbon dioxide from the thermal decomposition of metal carbonates, including copper(II) carbonate"},{"c":"2.13","t":"Know that carbon dioxide is a greenhouse gas and that increasing amounts in the atmosphere may contribute to climate change"},{"c":"2.14","t":"Practical: determine the approximate percentage by volume of oxygen in air using a metal or a non-metal"}]},{"id":"chem-2.15","g":"Reactivity series","n":"Reactivity series (1/2)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.15","t":"Understand how metals can be arranged in a reactivity series based on their reactions with: • water • dilute hydrochloric or sulfuric acid."},{"c":"2.16","t":"Understand how metals can be arranged in a reactivity series based on their displacement reactions between: • metals and metal oxides • metals and aqueous solutions of metal salts."},{"c":"2.17","t":"Know the order of reactivity of these metals: potassium, sodium, lithium, calcium, magnesium, aluminium, zinc, iron, copper, silver, gold"},{"c":"2.18","t":"Know the conditions under which iron rusts"}]},{"id":"chem-2.19","g":"Reactivity series","n":"Reactivity series (2/2)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.19","t":"Understand how the rusting of iron may be prevented by: • barrier methods • galvanising • sacrificial protection."},{"c":"2.20","t":"Understand the terms: • oxidation • reduction • redox • oxidising agent • reducing agent in terms of gain or loss of oxygen and loss or gain of electrons."},{"c":"2.21","t":"Practical: investigate reactions between dilute hydrochloric and sulfuric acids and metals (e.g. magnesium, zinc and iron)"}]},{"id":"chem-2.22C","g":"Extraction and uses of metals","n":"Extraction and uses of metals (1/2)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.22C","t":"Know that most metals are extracted from ores found in the Earth’s crust and that unreactive metals are often found as the uncombined element"},{"c":"2.23C","t":"Explain how the method of extraction of a metal is related to its position in the reactivity series, illustrated by carbon extraction for iron and electrolysis for aluminium"},{"c":"2.24C","t":"Be able to comment on a metal extraction process, given appropriate information detailed knowledge of the processes used in the extraction of a specific metal is not required"}]},{"id":"chem-2.25C","g":"Extraction and uses of metals","n":"Extraction and uses of metals (2/2)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.25C","t":"Explain the uses of aluminium, copper, iron and steel in terms of their properties the types of steel will be limited to low-carbon (mild), high-carbon and stainless"},{"c":"2.26C","t":"Know that an alloy is a mixture of a metal and one or more elements, usually other metals or carbon"},{"c":"2.27C","t":"Explain why alloys are harder than pure metals"}]},{"id":"chem-2.28","g":"Acids, alkalis and titrations","n":"Acids, alkalis and titrations (1/2)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.28","t":"Describe the use of litmus, phenolphthalein and methyl orange to distinguish between acidic and alkaline solutions"},{"c":"2.29","t":"Understand how to use the pH scale, from 0–14, can be used to classify solutions as strongly acidic (0–3), weakly acidic (4–6), neutral (7), weakly alkaline (8–10) and strongly alkaline (11–14)"},{"c":"2.30","t":"Describe the use of universal indicator to measure the approximate pH value of an aqueous solution"}]},{"id":"chem-2.31","g":"Acids, alkalis and titrations","n":"Acids, alkalis and titrations (2/2)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.31","t":"Know that acids in aqueous solution are a source of hydrogen ions and alkalis in a aqueous solution are a source of hydroxide ions"},{"c":"2.32","t":"Know that alkalis can neutralise acids"},{"c":"2.33C","t":"Describe how to carry out an acid-alkali titration"}]},{"id":"chem-2.34","g":"Acids, bases and salt preparations","n":"Acids, bases and salt preparations (1/3)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.34","t":"Know the general rules for predicting the solubility of ionic compounds in water: • common sodium, potassium and ammonium compounds are soluble • all nitrates are soluble • common chlorides are soluble, except those of silver and lead(II) • common sulfates are soluble, except for those of barium, calcium and lead(II) • common carbonates are insoluble, except for those of sodium, potassium and ammonium • common hydroxides are insoluble except for those of sodium, potassium and calcium (calcium hydroxide is slightly soluble)."},{"c":"2.35","t":"Understand acids and bases in terms of proton transfer"},{"c":"2.36","t":"Understand that an acid is a proton donor and a base is a proton acceptor"},{"c":"2.37","t":"Describe the reactions of hydrochloric acid, sulfuric acid and nitric acid with metals, bases and metal carbonates (excluding the reactions between nitric acid and metals) to form salts"}]},{"id":"chem-2.38","g":"Acids, bases and salt preparations","n":"Acids, bases and salt preparations (2/3)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.38","t":"Know that metal oxides, metal hydroxides and ammonia can act as bases, and that alkalis are bases that are soluble in water"},{"c":"2.39","t":"Describe an experiment to prepare a pure, dry sample of a soluble salt, starting from an insoluble reactant"},{"c":"2.40C","t":"Describe an experiment to prepare a pure, dry sample of a soluble salt, starting from an acid and alkali"}]},{"id":"chem-2.41C","g":"Acids, bases and salt preparations","n":"Acids, bases and salt preparations (3/3)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.41C","t":"Describe an experiment to prepare a pure, dry sample of an insoluble salt, starting from two soluble reactants"},{"c":"2.42","t":"Practical: prepare a sample of pure, dry hydrated copper(II) sulfate crystals starting from copper(II) oxide"},{"c":"2.43C","t":"Practical: prepare a sample of pure, dry lead(II) sulfate"}]},{"id":"chem-2.44","g":"Chemical tests","n":"Chemical tests (1/2)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.44","t":"Describe tests for these gases: • hydrogen • oxygen • carbon dioxide • ammonia • chlorine."},{"c":"2.45","t":"Describe how to carry out a flame test"},{"c":"2.46","t":"Know the colours formed in flame tests for these cations: • Li+ is red • Na+ is yellow • K+ is lilac • Ca2+ is orange-red • Cu2+ is blue-green."},{"c":"2.47","t":"Describe tests for these cations: • NH4+ using sodium hydroxide solution and identifying the gas evolved • Cu2+, Fe2+ and Fe3+ using sodium hydroxide solution."}]},{"id":"chem-2.48","g":"Chemical tests","n":"Chemical tests (2/2)","sec":"Inorganic Chemistry","k":"content","p":[{"c":"2.48","t":"Describe tests for these anions: • Cl–, Br– and I– using acidified silver nitrate solution • SO42– using acidified barium chloride solution • CO32– using hydrochloric acid and identifying the gas evolved."},{"c":"2.49","t":"Describe a test for the presence of water using anhydrous copper(II) sulfate"},{"c":"2.50","t":"Describe a physical test to show whether a sample of water is pure"}]},{"id":"chem-3.1","g":"Energetics","n":"Energetics (1/2)","sec":"Physical Chemistry","k":"content","p":[{"c":"3.1","t":"Know that chemical reactions in which heat energy is given out are described as exothermic, and those in which heat energy is taken in are described as endothermic"},{"c":"3.2","t":"Describe simple calorimetry experiments for reactions such as combustion, displacement, dissolving and neutralisation"},{"c":"3.3","t":"Calculate the heat energy change from a measured temperature change using the expression Q = mcΔT"},{"c":"3.4","t":"Calculate the molar enthalpy change (ΔH) from the heat energy change, Q"}]},{"id":"chem-3.5C","g":"Energetics","n":"Energetics (2/2)","sec":"Physical Chemistry","k":"content","p":[{"c":"3.5C","t":"Draw and explain energy level diagrams to represent exothermic and endothermic reactions"},{"c":"3.6C","t":"Know that bond-breaking is an endothermic process and that bond-making is an exothermic process"},{"c":"3.7C","t":"Use bond energies to calculate the enthalpy change during a chemical reaction"},{"c":"3.8","t":"Practical: investigate temperature changes accompanying some of the following types of change: • salts dissolving in water • neutralisation reactions • displacement reactions • combustion reactions."}]},{"id":"chem-3.9","g":"Rates of reaction","n":"Rates of reaction (1/2)","sec":"Physical Chemistry","k":"content","p":[{"c":"3.9","t":"Describe experiments to investigate the effects of changes in surface area of a solid, concentration of a solution, temperature and the use of a catalyst on the rate of a reaction"},{"c":"3.10","t":"Describe the effects of changes in surface area of a solid, concentration of a solution, pressure of a gas, temperature and the use of a catalyst on the rate of a reaction"},{"c":"3.11","t":"Explain the effects of changes in surface area of a solid, concentration of a solution, pressure of a gas and temperature on the rate of a reaction in terms of particle collision theory"},{"c":"3.12","t":"Know that a catalyst is a substance that increases the rate of a reaction, but is chemically unchanged at the end of the reaction"}]},{"id":"chem-3.13","g":"Rates of reaction","n":"Rates of reaction (2/2)","sec":"Physical Chemistry","k":"content","p":[{"c":"3.13","t":"Know that a catalyst works by providing an alternative pathway with lower activation energy"},{"c":"3.14C","t":"Draw and explain reaction profile diagrams showing ΔH and activation energy"},{"c":"3.15","t":"Practical: investigate the effect of changing the surface area of marble chips and of changing the concentration of hydrochloric acid on the rate of reaction between marble chips and dilute hydrochloric acid"},{"c":"3.16","t":"Practical: investigate the effect of different solids on the catalytic decomposition of hydrogen peroxide solution"}]},{"id":"chem-3.17","g":"Reversible reactions and equilibria","n":"Reversible reactions and equilibria (1/2)","sec":"Physical Chemistry","k":"content","p":[{"c":"3.17","t":"Know that some reactions are reversible and this is indicated by the symbol ⇌ in equations"},{"c":"3.18","t":"Describe reversible reactions such as the dehydration of hydrated copper(II) sulfate and the effect of heat on ammonium chloride"},{"c":"3.19C","t":"Know that a reversible reaction can reach dynamic equilibrium in a sealed container"}]},{"id":"chem-3.20C","g":"Reversible reactions and equilibria","n":"Reversible reactions and equilibria (2/2)","sec":"Physical Chemistry","k":"content","p":[{"c":"3.20C","t":"Know that the characteristics of a reaction at dynamic equilibrium are: • the forward and reverse reactions occur at the same rate • the concentrations of reactants and products remain constant."},{"c":"3.21C","t":"Understand why a catalyst does not affect the position of equilibrium in a reversible reaction"},{"c":"3.22C","t":"Know the effect of changing either temperature or pressure on the position of equilibrium in a reversible reaction: • an increase (or decrease) in temperature shifts the position of equilibrium in the direction of the endothermic (or exothermic) reaction • an increase (or decrease) in pressure shifts the position of equilibrium in the direction that produces fewer (or more) moles of gas References to Le Chatelier's principle are not required"}]},{"id":"chem-4.1","g":"Introduction","n":"Introduction (1/2)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.1","t":"Know that a hydrocarbon is a compound of hydrogen and carbon only"},{"c":"4.2","t":"Understand how to represent organic molecules using empirical formulae, molecular formulae, general formulae, structural formulae and displayed formulae"},{"c":"4.3","t":"Know what is meant by the terms homologous series, functional group and isomerism"}]},{"id":"chem-4.4","g":"Introduction","n":"Introduction (2/2)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.4","t":"Understand how to name compounds relevant to this specification using the rules of International Union of Pure and Applied Chemistry (IUPAC) nomenclature. students will be expected to name compounds containing up to six carbon atoms"},{"c":"4.5","t":"Understand how to write the possible structural and displayed formulae of an organic molecule given its molecular formula"},{"c":"4.6","t":"Understand how to classify reactions of organic compounds as substitution, addition and combustion knowledge of reaction mechanisms is not required"}]},{"id":"chem-4.7","g":"Crude oil","n":"Crude oil (1/3)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.7","t":"Know that crude oil is a mixture of hydrocarbons"},{"c":"4.8","t":"Describe how the industrial process of fractional distillation separates crude oil into fractions"},{"c":"4.9","t":"Know the names and uses of the main fractions obtained from crude oil: refinery gases, gasoline, kerosene, diesel, fuel oil and bitumen"},{"c":"4.10","t":"Know the trend in colour, boiling point and viscosity of the main fractions"}]},{"id":"chem-4.11","g":"Crude oil","n":"Crude oil (2/3)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.11","t":"Know that a fuel is a substance that, when burned, releases heat energy"},{"c":"4.12","t":"Know the possible products of complete and incomplete combustion of hydrocarbons with oxygen in the air"},{"c":"4.13","t":"Understand why carbon monoxide is poisonous, in terms of its effect on the capacity of blood to transport oxygen references to haemoglobin are not required"},{"c":"4.14","t":"Know that, in car engines, the temperature reached is high enough to allow nitrogen and oxygen from air to react, forming oxides of nitrogen"}]},{"id":"chem-4.15","g":"Crude oil","n":"Crude oil (3/3)","sec":"Organic Chemistry","k":"content","p":
