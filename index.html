[{"c":"4.15","t":"Explain how the combustion of some impurities in hydrocarbon fuels results in the formation of sulfur dioxide"},{"c":"4.16","t":"Understand how sulfur dioxide and oxides of nitrogen contribute to acid rain"},{"c":"4.17","t":"Describe how long-chain alkanes are converted to alkenes and shorter-chain alkanes by catalytic cracking (using silica or alumina as the catalyst and a temperature in the range of 600–700 ºC)"},{"c":"4.18","t":"Explain why cracking is necessary, in terms of the balance between supply and demand for different fractions"}]},{"id":"chem-4.19","g":"Alkanes","n":"Alkanes","sec":"Organic Chemistry","k":"content","p":[{"c":"4.19","t":"Know the general formula for alkanes"},{"c":"4.20","t":"Explain why alkanes are classified as saturated hydrocarbons"},{"c":"4.21","t":"Understand how to draw the structural and displayed formulae for alkanes with up to five carbon atoms in the molecule, and to name the unbranched-chain isomers"},{"c":"4.22","t":"Describe the reactions of alkanes with halogens in the presence of ultraviolet radiation, limited to mono-substitution knowledge of reaction mechanisms is not required"}]},{"id":"chem-4.23","g":"Alkenes","n":"Alkenes (1/2)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.23","t":"Know that alkenes contain the functional group >C=C<"},{"c":"4.24","t":"Know the general formula for alkenes"},{"c":"4.25","t":"Explain why alkenes are classified as unsaturated hydrocarbons"}]},{"id":"chem-4.26","g":"Alkenes","n":"Alkenes (2/2)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.26","t":"Understand how to draw the structural and displayed formulae for alkenes with up to four carbon atoms in the molecule, and name the unbranched-chain isomers knowledge of cis/trans or E/Z notation is not required"},{"c":"4.27","t":"Describe the reactions of alkenes with bromine to produce dibromoalkanes"},{"c":"4.28","t":"Describe how bromine water can be used to distinguish between an alkane and an alkene"}]},{"id":"chem-4.29C","g":"Alcohols","n":"Alcohols (1/2)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.29C","t":"Know that alcohols contain the functional group −OH"},{"c":"4.30C","t":"Understand how to draw structural and displayed formulae for methanol, ethanol, propanol (propan-1-ol only) and butanol (butan-1-ol only), and name each compound the names propanol and butanol are acceptable"},{"c":"4.31C","t":"Know that ethanol can be oxidised by: • burning in air or oxygen (complete combustion) • reaction with oxygen in the air to form ethanoic acid (microbial oxidation) • heating with potassium dichromate(VI) in dilute sulfuric acid to form ethanoic acid"}]},{"id":"chem-4.32C","g":"Alcohols","n":"Alcohols (2/2)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.32C","t":"Know that ethanol can be manufactured by: • reacting ethene with steam in the presence of a phosphoric acid catalyst at a temperature of about 300 ºC and a pressure of about 60–70 atm • the fermentation of glucose, in the absence of air, at an optimum temperature of about 30 ºC and using the enzymes in yeast"},{"c":"4.33C","t":"Understand the reasons for fermentation, in the absence of air, and at an optimum temperature"}]},{"id":"chem-4.34C","g":"Carboxylic acids","n":"Carboxylic acids","sec":"Organic Chemistry","k":"content","p":[{"c":"4.34C","t":"Know that carboxylic acids contain the functional group"},{"c":"4.35C","t":"Understand how to draw structural and displayed formulae for unbranched-chain carboxylic acids with up to four carbon atoms in the molecule, and name each compound"},{"c":"4.36C","t":"Describe the reactions of aqueous solutions of carboxylic acids with metals and metal carbonates"},{"c":"4.37C","t":"Know that vinegar is an aqueous solution containing ethanoic acid"}]},{"id":"chem-4.38C","g":"Esters","n":"Esters (1/2)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.38C","t":"Know that esters contain the functional group"},{"c":"4.39C","t":"Know that ethyl ethanoate is the ester produced when ethanol and ethanoic acid react in the presence of an acid catalyst"},{"c":"4.40C","t":"Understand how to write the structural and displayed formulae of ethyl ethanoate"}]},{"id":"chem-4.41C","g":"Esters","n":"Esters (2/2)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.41C","t":"Understand how to write the structural and displayed formulae of an ester, given the name or formula of the alcohol and carboxylic acid from which it is formed and vice versa"},{"c":"4.42C","t":"Know that esters are volatile compounds with distinctive smells and are used as food flavourings and in perfumes"},{"c":"4.43C","t":"Practical: prepare a sample of an ester such as ethyl ethanoate"}]},{"id":"chem-4.44","g":"Synthetic polyesters","n":"Synthetic polyesters (1/2)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.44","t":"Know that an addition polymer is formed by joining up many small molecules called monomers"},{"c":"4.45","t":"Understand how to draw the repeat unit of an addition polymer, including poly(ethene), poly(propene), poly(chloroethene) and (poly)tetrafluoroethene"},{"c":"4.46","t":"Understand how to deduce the structure of a monomer from the repeat unit of an addition polymer and vice versa"},{"c":"4.47","t":"Explain problems in the disposal of addition polymers, including: • their inertness and inability to biodegrade • the production of toxic gases when they are burned."}]},{"id":"chem-4.48C","g":"Synthetic polyesters","n":"Synthetic polyesters (2/2)","sec":"Organic Chemistry","k":"content","p":[{"c":"4.48C","t":"Know that condensation polymerisation, in which a dicarboxylic acid reacts with a diol, produces a polyester and water"},{"c":"4.49C","t":"Understand how to write the structural and displayed formula of a polyester, showing the repeat unit, given the formulae of the monomers from which it is formed including the reaction of ethanedioic acid and ethanediol:"},{"c":"4.50C","t":"Know that some polyesters, known as biopolyesters, are biodegradable"}]}]},{"id":"cs","name":"Computer Science","board":"Edexcel GCSE 1CP2","spec":"https://qualifications.pearson.com/content/dam/pdf/GCSE/Computer%20Science/2020/specification-and-sample-assessments/GCSE_L1_L2_Computer_Science_2020_Specification.pdf","cards":[{"id":"cs-1.1.1","g":"Decomposition and abstraction","n":"Decomposition and abstraction","sec":"Computational thinking","k":"content","p":[{"c":"1.1.1","t":"Understand the benefit of using decomposition and abstraction to model aspects of the real world and analyse, understand and solve problems"},{"c":"1.1.2","t":"Understand the benefits of using subprograms"}]},{"id":"cs-1.2.1","g":"Algorithms","n":"Algorithms (1/2)","sec":"Computational thinking","k":"content","p":[{"c":"1.2.1","t":"Be able to follow and write algorithms (flowcharts, pseudocode*, program code) that use sequence, selection, repetition (count-controlled, condition-controlled) and iteration (over every item in a data structure), and input, processing and output to solve problems"},{"c":"1.2.2","t":"Understand the need for and be able to follow and write algorithms that use variables and constants and one- and two-dimensional data structures (strings, records, arrays)"},{"c":"1.2.3","t":"Understand the need for and be able to follow and write algorithms that use arithmetic operators (addition, subtraction, division, multiplication, modulus, integer division, exponentiation), relational operators (equal to, less than, greater than, not equal to, less than or equal to, greater than or equal to) and logical operators (AND, OR, NOT)"},{"c":"1.2.4","t":"Be able to determine the correct output of an algorithm for a given set of data and use a trace table to determine what value a variable will hold at a given point in an algorithm"}]},{"id":"cs-1.2.5","g":"Algorithms","n":"Algorithms (2/2)","sec":"Computational thinking","k":"content","p":[{"c":"1.2.5","t":"Understand types of errors that can occur in programs (syntax, logic, runtime) and be able to identify and correct logic errors in algorithms"},{"c":"1.2.6","t":"Understand how standard algorithms (bubble sort, merge sort, linear search, binary search) work"},{"c":"1.2.7","t":"Be able to use logical reasoning and test data to evaluate an algorithm’s fitness for purpose and efficiency (number of compares, number of passes through a loop, use of memory)"}]},{"id":"cs-1.3.1","g":"Truth tables","n":"Truth tables","sec":"Computational thinking","k":"content","p":[{"c":"1.3.1","t":"Be able to apply logical operators (AND, OR, NOT) in truth tables with up to three inputs to solve problems"}]},{"id":"cs-2.1.1","g":"Binary","n":"Binary (1/2)","sec":"Data","k":"content","p":[{"c":"2.1.1","t":"Understand that computers use binary to represent data (numbers, text, sound, graphics) and program instructions and be able to determine the maximum number of states that can be represented by a binary pattern of a given length"},{"c":"2.1.2","t":"Understand how computers represent and manipulate unsigned integers and two’s complement signed integers"},{"c":"2.1.3","t":"Be able to convert between denary and 8-bit binary numbers (0 to 255, -128 to +127)"}]},{"id":"cs-2.1.4","g":"Binary","n":"Binary (2/2)","sec":"Data","k":"content","p":[{"c":"2.1.4","t":"Be able to add together two positive binary patterns and apply logical and arithmetic binary shifts"},{"c":"2.1.5","t":"Understand the concept of overflow in relation to the number of bits available to store a value"},{"c":"2.1.6","t":"Understand why hexadecimal notation is used and be able to convert between hexadecimal and binary"}]},{"id":"cs-2.2.1","g":"Data representation","n":"Data representation","sec":"Data","k":"content","p":[{"c":"2.2.1","t":"Understand how computers encode characters using 7-bit ASCII"},{"c":"2.2.2","t":"Understand how bitmap images are represented in binary (pixels, resolution, colour depth)"},{"c":"2.2.3","t":"Understand how analogue sound is represented in binary (amplitude, sample rate, bit depth, sample interval)"},{"c":"2.2.4","t":"Understand the limitations of binary representation of data when constrained by the number of available bits"}]},{"id":"cs-2.3.1","g":"Data storage and compression","n":"Data storage and compression","sec":"Data","k":"content","p":[{"c":"2.3.1","t":"Understand that data storage is measured in binary multiples (bit, nibble, byte, kibibyte, mebibyte, gibibyte, tebibyte) and be able to construct expressions to calculate file sizes and data capacity requirements"},{"c":"2.3.2","t":"Understand the need for data compression and methods of compressing data (lossless, lossy)"}]},{"id":"cs-3.1.1","g":"Hardware","n":"Hardware","sec":"Computers","k":"content","p":[{"c":"3.1.1","t":"Understand the von Neumann stored program concept and the role of main memory (RAM), CPU (control unit, arithmetic logic unit, registers), clock, address bus, data bus, control bus in the fetch-decode-execute cycle"},{"c":"3.1.2","t":"Understand the role of secondary storage and the ways in which data is stored on devices (magnetic, optical, solid state)"},{"c":"3.1.3","t":"Understand the concept of an embedded system and what embedded systems are used for"}]},{"id":"cs-3.2.1","g":"Software","n":"Software","sec":"Computers","k":"content","p":[{"c":"3.2.1","t":"Understand the purpose and functionality of an operating system (file management, process management, peripheral management, user management)"},{"c":"3.2.2","t":"Understand the purpose and functionality of utility software (file repair, backup, data compression, disk defragmentation, anti-malware)"},{"c":"3.2.3","t":"Understand the importance of developing robust software and methods of identifying vulnerabilities (audit trails, code reviews)"}]},{"id":"cs-3.3.1","g":"Programming languages","n":"Programming languages","sec":"Computers","k":"content","p":[{"c":"3.3.1","t":"Understand the characteristics and purposes of low-level and high-level programming languages"},{"c":"3.3.2","t":"Understand how an interpreter differs from a compiler in the way it translates high-level code into machine code"}]},{"id":"cs-4.1.1","g":"Networks","n":"Networks (1/2)","sec":"Topic 4: Networks","k":"content","p":[{"c":"4.1.1","t":"Why computers are connected in a network"},{"c":"4.1.2","t":"Types of network (LAN, WAN)"},{"c":"4.1.3","t":"How the internet is structured (IP addressing, routers)"},{"c":"4.1.4","t":"Wired vs wireless performance (speed, range, latency, bandwidth)"}]},{"id":"cs-4.1.5","g":"Networks","n":"Networks (2/2)","sec":"Topic 4: Networks","k":"content","p":[{"c":"4.1.5","t":"Network speed in bits/s (kbit, Mbit, Gbit); expressions with file size, rate, time"},{"c":"4.1.6","t":"Network protocols (Ethernet, Wi-Fi, TCP/IP, HTTP, HTTPS, FTP; POP3, SMTP, IMAP)"},{"c":"4.1.7","t":"4-layer TCP/IP model (application, transport, internet, link) and data transmission"},{"c":"4.1.8","t":"Network topologies (bus, star, mesh)"}]},{"id":"cs-4.2.1","g":"Network security","n":"Network security","sec":"Topic 4: Networks","k":"content","p":[{"c":"4.2.1","t":"Importance of network security"},{"c":"4.2.1","t":"Identifying vulnerabilities (penetration testing, ethical hacking)"},{"c":"4.2.1","t":"Protecting networks (access control, physical security, firewalls)"}]},{"id":"cs-5.1.1","g":"Environmental","n":"Environmental","sec":"Topic 5: Issues and impact","k":"content","p":[{"c":"5.1.1","t":"Environmental issues of digital devices (energy use, manufacture, replacement cycle, disposal)"}]},{"id":"cs-5.2.1","g":"Ethical and legal","n":"Ethical and legal","sec":"Topic 5: Issues and impact","k":"content","p":[{"c":"5.2.1","t":"Personal data: privacy, ownership, consent, misuse, data protection"},{"c":"5.2.2","t":"AI, machine learning, robotics: accountability, safety, algorithmic bias, legal liability"},{"c":"5.2.3","t":"Intellectual property protection (copyright, patents, trademarks, licensing)"}]},{"id":"cs-5.3.1","g":"Cybersecurity","n":"Cybersecurity","sec":"Topic 5: Issues and impact","k":"content","p":[{"c":"5.3.1","t":"Malware threats (viruses, worms, Trojans, ransomware, key loggers)"},{"c":"5.3.1","t":"Hackers exploiting technical vulnerabilities (unpatched software, out-of-date anti-malware)"},{"c":"5.3.1","t":"Social engineering in cyberattacks"},{"c":"5.3.2","t":"Protection: anti-malware, encryption, acceptable use policies, backup and recovery"}]},{"id":"cs-6.1.1","g":"Develop code","n":"Develop code (1/2)","sec":"Topic 6: Problem solving with programming","k":"code","p":[{"c":"6.1.1","t":"Decomposition and abstraction to analyse and solve problems"},{"c":"6.1.2","t":"Read, write, analyse and refine programs in a high-level language"},{"c":"6.1.3","t":"Convert algorithms (flowcharts, pseudocode) into programs"},{"c":"6.1.4","t":"Readability: layout, indentation, comments, meaningful identifiers, white space"}]},{"id":"cs-6.1.5","g":"Develop code","n":"Develop code (2/2)","sec":"Topic 6: Problem solving with programming","k":"code","p":[{"c":"6.1.5","t":"Identify, locate, correct errors (logic, syntax, runtime)"},{"c":"6.1.6","t":"Logical reasoning and test data to evaluate fitness for purpose and efficiency"},{"c":"6.1.6","t":"Efficiency measures: number of compares, passes through a loop, memory use"}]},{"id":"cs-6.2.1","g":"Constructs","n":"Constructs","sec":"Topic 6: Problem solving with programming","k":"code","p":[{"c":"6.2.1","t":"Structural components: constants, variables, initialisation, assignment, sequences"},{"c":"6.2.1","t":"Selection, repetition, iteration, data structures, subprograms, parameters, I/O"},{"c":"6.2.2","t":"Write programs using sequencing, selection, repetition (count- and condition-controlled)"},{"c":"6.2.2","t":"Iteration over every item in a data structure; single entry/exit points"}]},{"id":"cs-6.3.1","g":"Data types and structures","n":"Data types and structures","sec":"Topic 6: Problem solving with programming","k":"code","p":[{"c":"6.3.1","t":"Primitive types (integer, real, Boolean, char)"},{"c":"6.3.1","t":"1D and 2D structured types (string, array, record)"},{"c":"6.3.2","t":"Appropriate use of variables and constants"},{"c":"6.3.3","t":"String manipulation (length, position, substrings, case conversion)"}]},{"id":"cs-6.4.1","g":"Input/output","n":"Input/output","sec":"Topic 6: Problem solving with programming","k":"code","p":[{"c":"6.4.1","t":"Accept and respond appropriately to user input"},{"c":"6.4.2","t":"Read from and write to comma separated value (CSV) text files"},{"c":"6.4.3","t":"Validation (length, presence, range, pattern checks)"},{"c":"6.4.4","t":"Authentication (ID and password, lookup)"}]},{"id":"cs-6.5.1","g":"Operators","n":"Operators","sec":"Topic 6: Problem solving with programming","k":"code","p":[{"c":"6.5.1","t":"Arithmetic: + - * /, modulus, integer division, exponentiation"},{"c":"6.5.2","t":"Relational: ==, <, >, !=, <=, >="},{"c":"6.5.3","t":"Logical: AND, OR, NOT"}]},{"id":"cs-6.6.1","g":"Subprograms","n":"Subprograms","sec":"Topic 6: Problem solving with programming","k":"code","p":[{"c":"6.6.1","t":"Use built-in/library and user-devised subprograms (procedures, functions)"},{"c":"6.6.2","t":"Functions return values; procedures do not (with or without parameters)"},{"c":"6.6.3","t":"Global vs local variables"}]}]},{"id":"maths","name":"Maths","board":"Edexcel IGCSE 4MA1","spec":"https://qualifications.pearson.com/content/dam/pdf/International%20GCSE/Mathematics%20A/2016/Specification%20and%20sample%20assessments/international-gcse-in-mathematics-spec-a.pdf","cards":[{"id":"maths-1.1.1","g":"Integers","n":"Integers","sec":"Numbers and the number system","k":"maths","p":[{"c":"1.1.1","t":"Place value, directed numbers in context, ordering integers"},{"c":"1.1.2","t":"Four operations, brackets and order of operations"},{"c":"1.1.3","t":"Odd, even, prime, factor, multiple"},{"c":"1.1.4","t":"Prime factors, common factors and common multiples"}]},{"id":"maths-1.2.1","g":"Fractions","n":"Fractions","sec":"Numbers and the number system","k":"maths","p":[{"c":"1.2.1","t":"Equivalent fractions, simplifying, mixed numbers and improper fractions"},{"c":"1.2.2","t":"Ordering fractions; fraction of a quantity; one number as a fraction of another"},{"c":"1.2.3","t":"Add, subtract, multiply and divide fractions"},{"c":"1.2.4","t":"Convert fractions to decimals/percentages; unit fractions as multiplicative inverses"}]},{"id":"maths-1.3.1","g":"Decimals","n":"Decimals","sec":"Numbers and the number system","k":"maths","p":[{"c":"1.3.1","t":"Decimal notation, place value and ordering decimals"},{"c":"1.3.2","t":"Convert terminating decimals to fractions/percentages"},{"c":"1.3.3","t":"[H] Convert recurring decimals to fractions"}]},{"id":"maths-1.4.1","g":"Powers and roots","n":"Powers and roots","sec":"Numbers and the number system","k":"maths","p":[{"c":"1.4.1","t":"Squares, cubes and their roots; index laws for integer, zero and negative powers"},{"c":"1.4.2","t":"Integers as products of prime powers; HCF and LCM"},{"c":"1.4.3","t":"[H] Meaning of surds; manipulate surds incl. rationalising a denominator"},{"c":"1.4.4","t":"[H] Index laws with integer, fractional and negative powers"}]},{"id":"maths-1.5.1","g":"Set language and notation","n":"Set language and notation","sec":"Numbers and the number system","k":"maths","p":[{"c":"1.5.1","t":"Sets, union, intersection, element of / not element of"},{"c":"1.5.2","t":"Universal set, empty set, complement; Venn diagrams"},{"c":"1.5.3","t":"[H] Sets defined algebraically; subsets"},{"c":"1.5.4","t":"[H] n(A) notation; Venn diagrams for numbers of elements; sets in practical problems"}]},{"id":"maths-1.6.1","g":"Percentages","n":"Percentages","sec":"Numbers and the number system","k":"maths","p":[{"c":"1.6.1","t":"Convert between percentages, fractions, decimals; one quantity as a % of another"},{"c":"1.6.2","t":"Percentages as multipliers; percentage increase/decrease"},{"c":"1.6.3","t":"Reverse percentages; compound interest and depreciation"},{"c":"1.6.4","t":"[H] Repeated percentage change; compound interest problems"}]},{"id":"maths-1.7.1","g":"Ratio and proportion","n":"Ratio and proportion","sec":"Numbers and the number system","k":"maths","p":[{"c":"1.7.1","t":"Ratio notation and simplifying; divide a quantity in a given ratio"},{"c":"1.7.2","t":"Use proportion to find unknowns; direct proportion"},{"c":"1.7.3","t":"Word problems incl. maps and scale diagrams"}]},{"id":"maths-1.8.1","g":"Degree of accuracy","n":"Degree of accuracy","sec":"Numbers and the number system","k":"maths","p":[{"c":"1.8.1","t":"Round to powers of 10, significant figures and decimal places"},{"c":"1.8.2","t":"Upper and lower bounds; estimation"},{"c":"1.8.3","t":"[H] Solve problems using upper and lower bounds"}]},{"id":"maths-1.9.1","g":"Standard form","n":"Standard form","sec":"Numbers and the number system","k":"maths","p":[{"c":"1.9.1","t":"Calculate with and interpret numbers in the form a x 10^n"},{"c":"1.9.2","t":"[H] Solve problems involving standard form"}]},{"id":"maths-1.10-1.11.1","g":"Applying number and electronic calculators","n":"Applying number and electronic calculators","sec":"Numbers and the number system","k":"maths","p":[{"c":"1.10-1.11.1","t":"Everyday use of number; time, money, currency conversion"},{"c":"1.10-1.11.2","t":"Metric units of mass, length, area, volume and capacity"},{"c":"1.10-1.11.3","t":"Efficient use of a scientific calculator"}]},{"id":"maths-2.1.1","g":"Use of symbols","n":"Use of symbols","sec":"Equations, formulae and identities","k":"maths","p":[{"c":"2.1.1","t":"Symbols for numbers and variables; generalised rules of arithmetic"},{"c":"2.1.2","t":"Index notation and index laws (integer, zero, negative powers)"},{"c":"2.1.3","t":"[H] Index notation with fractional, negative and zero powers"}]},{"id":"maths-2.2.1","g":"Algebraic manipulation","n":"Algebraic manipulation (1/2)","sec":"Equations, formulae and identities","k":"maths","p":[{"c":"2.2.1","t":"Substitute, collect like terms, expand single brackets, factorise common factors"},{"c":"2.2.2","t":"[H] Expand the product of two or more linear expressions"},{"c":"2.2.3","t":"[H] Factorise quadratic expressions (incl. ax^2 + bx + c)"}]},{"id":"maths-2.2.4","g":"Algebraic manipulation","n":"Algebraic manipulation (2/2)","sec":"Equations, formulae and identities","k":"maths","p":[{"c":"2.2.4","t":"[H] Algebraic fractions with numeric, linear or quadratic numerator/denominator"},{"c":"2.2.5","t":"[H] Complete the square"},{"c":"2.2.6","t":"[H] Use algebra to support and construct proofs"}]},{"id":"maths-2.3.1","g":"Expressions and formulae","n":"Expressions and formulae","sec":"Equations, formulae and identities","k":"maths","p":[{"c":"2.3.1","t":"Substitute values (integers, decimals, fractions) into formulae"},{"c":"2.3.2","t":"Derive formulae/expressions from contexts"},{"c":"2.3.3","t":"[H] Change the subject where it appears twice or as a power"}]},{"id":"maths-2.4.1","g":"Linear equations","n":"Linear equations","sec":"Equations, formulae and identities","k":"maths","p":[{"c":"2.4.1","t":"Solve linear equations with unknowns on one or both sides"},{"c":"2.4.2","t":"Set up linear equations from data/contexts"},{"c":"2.4.3","t":"[H] Equations involving algebraic fractions"}]},{"id":"maths-2.5.1","g":"Proportion (Higher only)","n":"Proportion (Higher only)","sec":"Equations, formulae and identities","k":"maths","p":[{"c":"2.5.1","t":"[H] Set up and solve direct and inverse proportion problems (incl. squares, cubes, roots)"},{"c":"2.5.2","t":"[H] Relate algebraic solutions to graphs of the proportion equations"}]},{"id":"maths-2.6.1","g":"Simultaneous linear equations","n":"Simultaneous linear equations","sec":"Equations, formulae and identities","k":"maths","p":[{"c":"2.6.1","t":"Exact solution of two linear equations in two unknowns"},{"c":"2.6.2","t":"[H] Interpret the solution as the intersection of two lines"}]},{"id":"maths-2.7.1","g":"Quadratic equations","n":"Quadratic equations","sec":"Equations, formulae and identities","k":"maths","p":[{"c":"2.7.1","t":"Solve quadratics by factorisation"},{"c":"2.7.2","t":"[H] Solve using the quadratic formula or completing the square"},{"c":"2.7.3","t":"[H] Form and solve quadratic equations from a context"},{"c":"2.7.4","t":"[H] Simultaneous equations: one linear and one quadratic"}]},{"id":"maths-2.8.1","g":"Inequalities","n":"Inequalities","sec":"Equations, formulae and identities","k":"maths","p":[{"c":"2.8.1","t":"Inequality symbols; solve linear inequalities and show on a number line"},{"c":"2.8.2","t":"Represent linear inequalities and regions on a Cartesian graph"},{"c":"2.8.3","t":"[H] Solve quadratic inequalities; show solution set on a number line"},{"c":"2.8.4","t":"[H] Harder regions defined by linear inequalities"}]},{"id":"maths-3.1.1","g":"Sequences","n":"Sequences","sec":"Sequences, functions and graphs","k":"maths","p":[{"c":"3.1.1","t":"Term-to-term and position-to-term rules; nth term of arithmetic sequences"},{"c":"3.1.2","t":"[H] First term a and common difference d; nth term a + (n-1)d"},{"c":"3.1.3","t":"[H] Sum of the first n terms of an arithmetic series"}]},{"id":"maths-3.2.1","g":"Function notation (Higher only)","n":"Function notation (Higher only)","sec":"Sequences, functions and graphs","k":"maths","p":[{"c":"3.2.1","t":"[H] Function as a mapping; f(x) and f: x -> notation"},{"c":"3.2.2","t":"[H] Domain and range; values excluded from a domain"},{"c":"3.2.3","t":"[H] Composite functions fg and inverse functions f^-1"}]},{"id":"maths-3.3.1","g":"Graphs","n":"Graphs (1/2)","sec":"Sequences, functions and graphs","k":"maths","p":[{"c":"3.3.1","t":"Interpret linear/non-linear graphs incl. distance-time and speed-time; conversion graphs"},{"c":"3.3.2","t":"Midpoints, gradients, y = mx + c; plot linear and quadratic graphs"},{"c":"3.3.3","t":"[H] Plot/recognise cubic, reciprocal and trig graphs (sin, cos, tan any angle)"},{"c":"3.3.4","t":"[H] Transformations y=f(x)+a, f(ax), f(x+a), af( /* the subjects this student takes (Settings → Your subjects); everything else is hidden */
let CURRICULUM = ALL_SUBJECTS;
function applySubjects(){ const on = (S && S.settings && S.settings.subjects) || []; CURRICULUM = ALL_SUBJECTS.filter(x => on.includes(x.id)); }

/* ---------- dates ---------- */
const DAY = 86400000;
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const parse = s => new Date(s+'T12:00:00Z');
let FORCE_DAY = null; // used only while forecasting
const todayStr = () => { if (FORCE_DAY) return FORCE_DAY; const n=new Date(); return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate()); };
const addDays = (s,n) => iso(new Date(parse(s).getTime()+n*DAY));
/* exam and mock dates from the papers list (falls back to 10 May / the mock week) */
const paperDates = (sid, st, k) => ((st || S.settings).papers && (st || S.settings).papers[sid] || []).map(q => q[k]).filter(Boolean).sort();
const examFirst = (sid, st) => paperDates(sid, st, 'exam')[0] || '2027-05-10';
const examLast = (sid, st) => { const d = paperDates(sid, st, 'exam'); return d.length ? d[d.length-1] : examFirst(sid, st); };
const mockFirst = (sid, st) => paperDates(sid, st, 'mock')[0] || ((st || S.settings).mocks || {}).from;
const diff = (a,b) => Math.round((parse(b)-parse(a))/DAY); // b - a in days
const fmtDay = s => parse(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short',timeZone:'UTC'});
const fmtShort = s => parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
const hash = s => { let h=2166136261; for (const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; };

/* ---------- curriculum index ---------- */
const SUBJ = {}; const CARD = {};
ALL_SUBJECTS.forEach(s => { SUBJ[s.id]=s; s.cards.forEach((c,i) => { c.sid=s.id; c.i=i; CARD[c.id]=c; }); });

  const exams = {}; ALL_SUBJECTS.forEach(s => exams[s.id] = '2027-05-10');
  return {
    startedOn: todayStr(),

function capDue(c, due, today){
  const s = S.settings; const j = hash(c.id+due);

function rateCard(id, r, type, today, lvl5){
  const c = CARD[id]; const old = cs(id); const s = Object.assign({}, old);
  s.n = (s.n||0)+1; s.last = today; s.lvl = lvl5!=null ? lvl5 : r; s.lr = 1;

  if (r===3){ s.st='learning'; s.stg=0; s.due=addDays(today,1); s.lapses=(s.lapses||0)+1; }
  else if (!wasReview && r===1 && L5<=1.5){ s.st='review'; s.trk = L5<=1 ? 'g1' : 'g2'; s.left = GREEN_LEFT[s.trk]; s.stg=0; s.due = spreadDue(c, today, s.left); } // green after revising: fewer, spread-out refreshers

/* ---------- day targets ---------- */
function dayInfo(d){
  const base = baseDayInfo(d); const o = (S.settings.overrides||{})[d];

  const label = base.target===0 ? `${base.label} skipped · studying` : +o===0 ? `${base.label} · skipped` : +o > base.target ? `${base.label} · +${fmtMin(o-base.target)} extra` : `${base.label} · changed to ${fmtMin(o)}`;

}
function setOverride(d, n){

  if (n==null) delete o[d]; else o[d] = n;
  // forget overrides for days long gone
  Object.keys(o).forEach(k => { if (k < addDays(todayStr(), -14)) delete o[k]; });
  S.settings.overrides = o; current = null; window.__anyway = false; save();
}
function baseDayInfo(d){
  const s = S.settings;
  if (s.mocks && d>=s.mocks.from && d<=s.mocks.to) return {target:+s.mocks.target, label:'Mock exams', kind:'mocks'};
  for (const p of s.periods) if (d>=p.from && d<=p.to) return {target:+p.target, label:p.name, kind:'holiday'};
  const wd = parse(d).getUTCDay();
  const t = +s.week[wd];

}
const doneOn = d => S.log.filter(l => l.d===d).reduce((a,l) => a + sessMins(l), 0);   // minutes studied that day

/* ---------- the scheduler ---------- */
let skipped = new Set(); let skipDay = todayStr();
function liveSubjects(today){ return CURRICULUM.filter(s => examLast(s.id) >= today); }   // a subject stays in the plan until its last paper

function pickNext(mode){
  const today = todayStr();
  if (skipDay!==today){ skipped = new Set(); skipDay = today; }
  const doneToday = new Set(S.log.filter(l=>l.d===today).flatMap(l=>l.c));
  const live = liveSubjects(today);
  const all = live.flatMap(s => s.cards).filter(c => !skipped.has(c.id) && !doneToday.has(c.id));
  const st = c => cs(c.id);
  const due = all.filter(c => st(c).st==='review' && st(c).due<=today)
                 .sort((a,b) => (st(a).due < st(b).due ? -1 : st(a).due > st(b).due ? 1 : (st(b).lvl||0)-(st(a).lvl||0)));
  const relearn = all.filter(c => st(c).st==='learning' && (st(c).due||today)<=today);
  const fresh_ = all.filter(c => st(c).st==='new');
  const maxOver = due.length ? diff(st(due[0]).due, today) : 0;

  // time left today (if the goal is already met, plan one more 45-minute block)
  let left = dayInfo(today).target - doneOn(today); if (left < 15) left = 45;
  let rlist = due;
  if (mode==='refresh' && !due.length){   // nothing due: pull forward the next refreshers
    rlist = all.filter(c => st(c).st==='review').sort((a,b) => st(a).due < st(b).due ? -1 : 1);
    if (!rlist.length) return null;
  }
  const pack = cap => { const pick = [], cm = {}; let m = 0; for (const c of rlist){ const x = refMin(c.id); if (pick.length && m + x > cap) continue; pick.push(c); cm[c.id] = x; m += x; if (m >= cap - 3) break; } return {type:'review', cards:pick.map(c=>c.id), mins:m, cm}; };
  // keep learning moving: once refreshers have taken half of today's time, switch to learning unless they're badly overdue
  const refToday = S.log.filter(l => l.d===today && (l.t==='review' || l.t==='quick')).reduce((a,l) => a + sessMins(l), 0);
  const reviewHeavy = refToday >= Math.max(30, dayInfo(today).target*0.5) && maxOver < 14 && (relearn.length || fresh_.length);
  // refreshers due: a block of up to 45 minutes (or whatever time is left), most overdue first
  if (mode==='refresh') return pack(20);
  if (due.length && !reviewHeavy && mode!=='revise') return pack(Math.max(15, Math.min(45, left)));
  const pool = relearn.concat(fresh_);
  const doneN = S.log.filter(l => l.d===today).length;
  if (mode!=='revise' && S.settings.papersFrom && today >= S.settings.papersFrom && doneN % 3 === 2 && !(due.length>=8)){
    const last = S.log.length ? S.log[S.log.length-1].s : null;
    const recentP = S.log.filter(l => l.t==='paper').slice(-live.length).map(l => l.s);
    const subs = live.filter(s => !skipped.has('paper:'+s.id)).sort((a,b) => (S.settings.exams[a.id]||'9') < (S.settings.exams[b.id]||'9') ? -1 : 1);
    const pick = subs.find(s => s.id!==last && !recentP.includes(s.id)) || subs.find(s => s.id!==last) || subs[0];
    if (pick) return {type:'paper', sid:pick.id, cards:[]};
  }
  if (!pool.length){
    if (due.length) return pack(45);
    const rev = all.filter(c => st(c).st==='review');
    if (!rev.length) return null;
    // nothing due: past-paper practice, nearest exam first (rotate away from the last subject)
    const last = S.log.length ? S.log[S.log.length-1].s : null;
    const subs = live.filter(s => s.cards.some(c => st(c).st==='review'))
      .sort((a,b) => (S.settings.exams[a.id]||'9') < (S.settings.exams[b.id]||'9') ? -1 : 1);
    const ok = subs.filter(s => !skipped.has('paper:'+s.id));
    const pick = ok.find(s => s.id!==last) || ok[0];

  }

  let lpool = pool;

    const lastWasRelearn = lastLearn && lastLearn.relearn;

  }
  // subject balance: target share by outstanding weakness (x exam urgency) vs recent learn share
  const W = {}; lpool.forEach(c => { W[c.sid] = (W[c.sid]||0) + (st(c).lvl||2) + (st(c).st==='learning'?1:0); });
  live.forEach(s => { if (W[s.id]){ const dte = diff(today, S.settings.exams[s.id]||'2027-06-30'); W[s.id] *= 1 + Math.max(0, 28-dte)/14; } });
  const tot = Object.values(W).reduce((a,b)=>a+b,0);
  const recent = S.log.filter(l => l.t==='learn').slice(-12);
  const R = {}; recent.forEach(l => R[l.s] = (R[l.s]||0)+1);
  const last = S.log.length ? S.log[S.log.length-1].s : null;
  let best=null, bestScore=-1e9;
  Object.keys(W).forEach(sid => {
    let sc = W[sid]/tot - (recent.length ? (R[sid]||0)/recent.length : 0);

  const cand = lpool.filter(c => c.sid===best).sort((a,b) => (prio(b)-prio(a)) || (a.i-b.i));
  return {type:'learn', cards:[cand[0].id], mins:learnMin(cand[0].id)};
}

/* ---------- pace check ---------- */
function pace(){
  const today = todayStr(); const live = liveSubjects(today);
  let learnNeed=0, active=0, unrated=0;
  live.forEach(s => s.cards.forEach(c => {
    const x = cs(c.id);
    if (x.st==='new' || x.st==='learning'){ const m = learnMin(c.id); learnNeed += m===45 ? 1.25 : m/45 + 0.15; active++; }
    else if (x.st==='review') active++;
    else if (x.st==='unrated'){ unrated++; learnNeed += 1.0; active++; }
  }));
  // refresher minutes still to come: green topics 5 min each that are left, others the rest of 10+10+5+5+5,
  // topics not revised yet about 25 min on average (some will come out green)
  let refMins = 0;
  live.forEach(sb => sb.cards.forEach(c => { const x = cs(c.id);
    if (x.st==='review') refMins += x.trk ? 5*(x.left||0) : R_DUR.slice(Math.min(x.stg||0, 5)).reduce((a,b) => a+b, 0);
    else if (x.st==='new' || x.st==='learning' || x.st==='unrated') refMins += 25; }));
  const reviewNeed = Math.round(refMins/45);
  const end = live.reduce((m,s)=> examLast(s.id) > m ? examLast(s.id) : m, today);
  let cap = 0; for (let d=today; d<end; d=addDays(d,1)) cap += dayInfo(d).target;
  cap -= Math.min(doneOn(today), dayInfo(today).target);
  return {need: Math.round(learnNeed)+reviewNeed, learnNeed:Math.round(learnNeed), reviewNeed, cap, end, unrated};
}

const SB_URL = 'https://aabzydfrevhufprmmjnq.supabase.co', SB_KEY = 'sb_publishable_U0bYmsiwR1jI5bGwYPbVUA_JmyayzZS';
let sb = null, USER = null, liveChannel = null;
function supaRef(uid){
  const ref = {
    async get(){ const {data, error} = await sb.from('progress').select('doc').eq('user_id', uid).maybeSingle(); if (error) throw error; return {exists: !!data, data: () => data && data.doc}; },
    async set(doc){ const {error} = await sb.from('progress').upsert({user_id: uid, doc}); if (error) throw error; },
    onSnapshot(cb, onErr){
      const pull = () => ref.get().then(s => cb({exists: s.exists, data: s.data, metadata: {}})).catch(e => onErr && onErr(e));
      pull();
      // another device saved: fetch the row again (the change event itself may be cut short for big rows)
      liveChannel = sb.channel('progress-' + uid)
        .on('postgres_changes', {event: '*', schema: 'public', table: 'progress', filter: 'user_id=eq.' + uid}, () => pull())
        .subscribe();
    }
  };
  return ref;
}
async function connect(){
  if (!USER){ setState('local'); return; }
  dbRef = supaRef(USER.id);

  const t = setTimeout(() => setSync('Can’t reach online storage yet. Using this device’s copy.'), 10000);

    if (snap.metadata && snap.metadata.hasPendingWrites) return;

const isRef = n => n.type==='review' || n.type==='quick';
function startKind(d, after){
  if (after) return isRef(after) ? 'block' : 'ref';
  const last = S.log.filter(l => l.d===d).slice(-1)[0];

function mixDay(list, start){

  if (!refs.length || !blocks.length) return list;
  const slots = start==='ref' ? blocks.length + 1 : blocks.length;      // refresher groups
  const groups = Array.from({length:slots}, () => []);
  refs.forEach((r, i) => groups[Math.floor(i*slots/refs.length)].push(r));
  const packOf = g => { const cm = {}; g.forEach(r => cm[r.id] = r.m); return {type:g[0].type, cards:g.map(r => r.id), mins:g.reduce((a,r) => a + r.m, 0), cm}; };

  if (start==='ref'){ groups.forEach((g, i) => { if (g.length) out.push(packOf(g)); if (blocks[i]) out.push(blocks[i]); }); }

}

const tlEnd = () => { const t = todayStr(); if (tlRange!=='exam') return t; const e = tlSubj==='all' ? CURRICULUM.map(x => examFirst(x.id)).sort()[0] : examFirst(tlSubj); return e && e > t ? e : t; };
const tlMock = () => { const m = tlSubj==='all' ? CURRICULUM.map(x => mockFirst(x.id)).filter(Boolean).sort()[0] : mockFirst(tlSubj); return m; };
const tlKey = metric => metric==='work' ? 'w_' + tlSubj : tlSubj;
const tlNow = metric => { const cards = tlSubj==='all' ? CURRICULUM.flatMap(x => x.cards) : SUBJ[tlSubj].cards; return metric==='work' ? workOf(cards, true).pct : progressOf(cards); };
function timelineSeries(metric){
  const today = todayStr(); const start = S.settings.startedOn;
  const from = tlRange==='week' ? addDays(today,-6) : tlRange==='month' ? addDays(today,-29) : start;
  const keys = Object.keys(S.hist||{}).sort();
  const pts = []; let last = null; let ki = 0;
  const key = tlKey(metric);
  while (ki < keys.length && keys[ki] < from){ const v0 = S.hist[keys[ki]][key]; if (v0!=null) last = v0; ki++; }
  const end = tlEnd();     // "To exams" runs the axis on to the first exam; days after today stay empty
  for (let d = from; d <= end; d = addDays(d,1)){
    if (d > today){ pts.push({d, v:null, future:true}); continue; }
    while (ki < keys.length && keys[ki] <= d){ const v = S.hist[keys[ki]][key]; if (v!=null) last = v; ki++; }
    let v = d===today ? tlNow(metric) : (d < start ? null : last);
    pts.push({d, v});
  }

}

function quoteOf(d){ const n = diff('2026-01-01', d); return QUOTES[((n % QUOTES.length) + QUOTES.length) % QUOTES.length]; }
function periodStats(from, to){
  const today = todayStr(); let planned=0, plannedLeft=0, done=0;
  for (let d=from; d<=to; d=addDays(d,1)){
    const t = dayInfo(d).target; const dn = doneOn(d);
    if (d < S.settings.startedOn){ done += dn; continue; }
    planned += Math.max(t, d < today ? dn : t);
    if (d > today) plannedLeft += t; else if (d===today) plannedLeft += Math.max(0, t-dn);
    done += dn;
  }
  return {planned, done, left: plannedLeft};
}
function streak(){
  let n = 0; const today = todayStr();
  if (doneOn(today) >= dayInfo(today).target && dayInfo(today).target>0) n++;
  for (let d = addDays(today,-1); d >= S.settings.startedOn; d = addDays(d,-1)){
    const t = dayInfo(d).target; if (t===0) continue;
    if (doneOn(d) >= t) n++; else break;
  }
  return n;
}

function pointsHTML(c, opts){
  opts = opts || {};
  const lv = c.p.map((p,i) => opts.pick && opts.pick[pk(c.id,i)]!=null ? opts.pick[pk(c.id,i)] : ptLvl(c,i));
  const worst = Math.max(0, ...lv.map(v => v||0));
  return '<ul class="points">'+c.p.map((p,i) => {
    const pv = opts.pick ? opts.pick[pk(c.id,i)] : undefined;
    const on = v => opts.live ? snap(lv[i])===v : pv===v;
    const ctl = opts.rate ? `<div class="pr" data-k="${pk(c.id,i)}" role="group" aria-label="Rate ${esc(p.c)}">
        ${[3,2.5,2,1.5,1].map(v => `<button class="${lvClass(v)}" data-v="${v}" aria-pressed="${on(v)}" aria-label="${LVNAME[v]}" title="${LVNAME[v]}"></button>`).join('')}</div>` : '';
    return `<li class="${opts.rate?'rated ':''}${!opts.rate && lv[i] && lv[i]===worst && worst>=2.5 ? 'focus':''}"><span class="rag ${lvClass(lv[i])}" title="${lv[i]==null?'Not rated':LVNAME[snap(lv[i])]}"></span><span class="code">${esc(p.c)}</span><span>${esc(p.t)}</span>${ctl}</li>`;
  }).join('')+'</ul>';
}

function allRated(cards){ return cards.every(c => c.p.every((_,i) => current.pr[pk(c.id,i)]!=null)); }

/* a bonus 5-minute refresher: the next topic coming up for a refresher that isn't planned today, 5-minute ones first */
function quickNext(){
  const today = todayStr();
  const busy = new Set(S.log.filter(l => l.d===today).flatMap(l => l.c || []).concat(current ? current.cards : [], (todayRest||[]).flatMap(n => n.cards || [])));
  const c = liveSubjects(today).flatMap(sb => sb.cards).filter(c => cs(c.id).st==='review' && !busy.has(c.id))
    .sort((a,b) => (refMin(a.id)===5 ? 0 : 1) - (refMin(b.id)===5 ? 0 : 1) || (cs(a.id).due < cs(b.id).due ? -1 : 1))[0];
  return c ? {type:'quick', cards:[c.id], mins:5, cm:{[c.id]:5}} : null;
}
function startQuick(){
  const n = quickNext(); if (!n) return false;
  current = {type:'quick', cards:n.cards, mins:5, cm:n.cm, phase:'work', ratings:{}, pr:{}, extra:true};
  resetTimer(); render(); window.scrollTo({top:0, behavior:'smooth'}); return true;
}

    c.p.forEach((_,i) => { n++; const v = snap(ptLvl(c,i)); got += v==null ? 0 : PW[v]; }); });

/* work done: minutes. A topic from scratch (very weak, never studied) takes about FULL_MIN with this plan:

   the difference is the time it would have taken to get you to where you are. Unrated and "off" topics are left out. */
const FULL_MIN = 140;

function remMin(c){
  const x = cs(c.id);
  if (x.st==='off' || x.st==='unrated') return null;
  if (x.st==='later') return FULL_MIN;
  if (x.st==='new') return REM_NEW[snap(x.lvl)] ?? FULL_MIN;
  if (x.st==='learning') return RE_REV + 35;
  if (x.st==='review') return x.trk ? 5*(x.left||0) : R_DUR.slice(Math.min(x.stg||0, 5)).reduce((a,b) => a+b, 0);
  return FULL_MIN;

  const total = n*FULL_MIN;

  return {pct: total && (overall || n >= unr) ? Math.round(100*(total-left)/total) : null, done: total-left, left, n, unr};

/* week forecast: replay the scheduler on a copy of your progress, assuming learn sessions come out amber and reviews green */
function forecast(untilDay){
  const real = todayStr(); const out = {};
  const keepS = S, keepSkip = skipped, keepSkipDay = skipDay;
  S = JSON.parse(JSON.stringify(keepS)); skipped = new Set();
  try {
    for (let d = real; d <= untilDay; d = addDays(d,1)){
      FORCE_DAY = d; skipDay = d; out[d] = [];
      let left = dayInfo(d).target - doneOn(d);
      for (let guard=0; left>0 && guard<30; guard++){
        const n = pickNext(); if (!n) break;
        if ((n.type==='learn' || n.type==='paper') && left < Math.min(30, (n.mins||45) - 5)) break;
        out[d].push(n); left -= (n.mins || 45);
        if (n.type==='paper'){ S.log.push({d, t:'paper', s:n.sid, c:[], r:[], mins:45}); continue; }
        const wasRel = n.type==='learn' && cs(n.cards[0]).st==='learning';
        const r = n.type==='learn' ? 2 : 1;
        n.cards.forEach(id => rateCard(id, r, n.type, d));
        S.log.push({d, t:n.type, s:CARD[n.cards[0]].sid, c:n.cards, r:n.cards.map(()=>r), relearn:wasRel, mins:n.mins, cm:n.cm});
      }
    }
  } finally { FORCE_DAY = null; S = keepS; skipped = keepSkip; skipDay = keepSkipDay; }
  return out;
}
let weekOffset = 0;
function mondayOf(d){ const wd = (parse(d).getUTCDay()+6)%7; return addDays(d, -wd); }
function sessLabel(n){
  if (n.type==='paper') return {k:'Past paper · 45 min', s:SUBJ[n.sid].name, t:'Exam practice'};
  const c = CARD[n.cards[0]];
  if (n.type==='review' || n.type==='quick'){ const subs = [...new Set(n.cards.map(id => SUBJ[CARD[id].sid].name))]; const m = n.cm ? n.cards.reduce((a,id) => a + (n.cm[id] != null ? n.cm[id] : refMin(id)), 0) : n.mins != null ? n.mins : n.cards.reduce((a,id) => a + refMin(id), 0); return {k:`${n.type==='quick' ? 'Quick refresher' : 'Refresher'} · ${m} min`, s:subs.join(', '), t:n.cards.map(id => CARD[id].n).join(' · ')}; }
  return {k: (cs(c.id).st==='learning' ? 'Revise again' : 'Revise') + ' · ' + (n.mins || 45) + ' min', s:SUBJ[c.sid].name, t:c.n};
}
/* what's inside a session, shown when you open it */
function sessDetail(n){
  if (n.type==='paper') return `<div class="sd">${esc(SUBJ[n.sid].board)}: 45 minutes of a past paper in exam conditions, then mark it.</div>`;
  if (n.type==='learn'){ const c = CARD[n.cards[0]];
    return `<div class="sd"><div class="sd-sec">${esc(c.sec)}</div><ul class="sd-pts">${c.p.map((p,i) => `<li><i class="rag ${lvClass(ptLvl(c,i))}"></i><span class="code">${esc(p.c)}</span><span>${esc(p.t)}</span></li>`).join('')}</ul></div>`; }
  return `<div class="sd"><ul class="sd-pts">${n.cards.map(id => { const c = CARD[id]; return `<li><i class="rag ${lvClass(cs(id).lvl)}"></i><span class="code">${n.cm && n.cm[id] != null ? n.cm[id] : refMin(id)} min</span><span>${icon(c.sid,13)} ${esc(SUBJ[c.sid].name)} · ${esc(c.n)}</span></li>`; }).join('')}</ul></div>`;
}
function papersOn(d){ const out = []; CURRICULUM.forEach(sb => (S.settings.papers[sb.id]||[]).forEach(q => { if (q.mock===d) out.push({k:'mock', sid:sb.id, n:q.n}); if (q.exam===d) out.push({k:'exam', sid:sb.id, n:q.n}); })); return out.sort((a,b) => a.k < b.k ? -1 : 1); }
function weekHTML(){
  const today = todayStr(); const mon = addDays(mondayOf(today), weekOffset*7); const sun = addDays(mon,6);
  const key = [S.updated, weekOffset, today, current ? current.cards.join(',') : ''].join('|');
  if (!window.__fcCache || window.__fcCache.key !== key) window.__fcCache = {key, fc: sun >= today ? forecast(sun) : {}};
  const fc = window.__fcCache.fc;
  const days = Array.from({length:7}, (_,i) => addDays(mon,i));
  let total = 0;
  const cols = days.map(d => {
    const info = dayInfo(d);
    const done = S.log.filter(l => l.d===d).map(l => ({n: l.t==='paper' ? {type:'paper', sid:l.s, cards:[]} : {type:l.t, cards:l.c, mins:l.mins, cm:l.cm}, r:l.r}));
    const plan = d >= today ? (d===today ? (current ? [current] : []).concat(todayRest || []) : mixDay(fc[d]||[], startKind(d))) : [];
    total += doneOn(d) + plan.reduce((x,n) => x + (n.mins || 45), 0);
    const item = (n, r, planned) => { const L = sessLabel(n);
      // colour = confidence: the rating you gave if done, otherwise the topic's current level
      const v = r && r.length && r[0]!=null ? r[0] : (n.cards && n.cards.length ? cs(n.cards[0]).lvl : null);
      const lc = v==null ? 'var(--grey)' : 'var(--lv' + String(snap(v)).replace('.','') + ')';
      return `<li class="wk-s ${planned?'planned':''} t-${n.type}" style="border-left-color:${lc}">${isRef(n) ? '' : '<details class="sx"><summary>'}<div class="wk-k">${planned ? '' : '<span class="wk-tick" title="Done" aria-label="Done">✓</span>'}${esc(L.k)}${r && r.length ? ' '+r.map(x => `<i class="rag ${lvClass(x)}"></i>`).join('') : ''}</div><div class="wk-sub">${esc(L.s)}</div><div class="wk-t">${esc(L.t)}</div>${isRef(n) ? '' : `</summary>${sessDetail(n)}</details>`}</li>`; };
    // refresher packs are listed card by card
    const split = (n, r) => (n.type==='review' || n.type==='quick') && n.cards.length > 1
      ? n.cards.map((id, i) => { const m = n.cm && n.cm[id] != null ? n.cm[id] : refMin(id); return {n:{type:n.type, cards:[id], mins:m, cm:{[id]:m}}, r: r && r[i] != null ? [r[i]] : null}; })
      : [{n, r}];
    const dm = doneOn(d);
    const missed = '';   // no 'not done' line: past days only show what was done
    return `<div class="wk-day ${d===today?'is-today':''} ${info.target===0?'is-off':''}">
      <div class="wk-h"><span class="wk-dn">${esc(parse(d).toLocaleDateString('en-GB',{weekday:'short',timeZone:'UTC'}))}</span> <span class="wk-dd">${esc(fmtShort(d))}</span>
        <div class="wk-l">${esc(info.label)}</div>${papersOn(d).map(x => `<div class="wk-ex ${x.k}">${x.k==='exam' ? 'Exam' : 'Mock'} · ${esc(SUBJ[x.sid].name)} ${esc(x.n.split(':')[0])}</div>`).join('')}<div class="wk-time">${info.target ? (d <= today && dm ? `${fmtMin(dm)} of ${fmtMin(info.target)}` : fmtMin(info.target)) : (dm ? fmtMin(dm) : 'No study time')}</div>
        ${d >= today ? (info.override
          ? `<button class="wk-ov" data-wkov="${d}" data-n="">Undo change</button>`
          : info.target===0 ? `<button class="wk-ov" data-wkov="${d}" data-n="90">Study instead</button>` : `<button class="wk-ov" data-wkov="${d}" data-n="0">Skip day</button>`) : ''}</div>
      <ul>${done.flatMap(x => split(x.n, x.r)).map(x => item(x.n, x.r, false)).join('')}${plan.flatMap(n => split(n, null)).map(x => item(x.n, null, true)).join('')}${missed}${!done.length && !plan.length && !missed ? `<li class="wk-free">${info.target===0 ? 'Free' : d < today ? '' : 'Nothing due'}</li>` : ''}</ul></div>`;
  }).join('');
  return `<section class="panel"><div class="row" style="justify-content:space-between">
      <h2>Week of ${esc(fmtShort(mon))}</h2>
      <div class="row"><button class="btn small ghost" id="wkprev" aria-label="Previous week">←</button><button class="btn small ghost" id="wknow">This week</button><button class="btn small ghost" id="wknext" aria-label="Next week">→</button></div></div>
    <p class="small muted" style="margin:0">The colour on the left of each box is how confident you are in that topic (your rating, from dark green to red). Solid boxes are sessions you've done. Dashed boxes are the forecast: the schedule re-plans after every rating, so these will shift. ${fmtMin(total)} of study this week.</p>
    <div class="wk">${cols}</div></section>`;
}

  // Email links carry a one-time token_hash. Mail scanners open links to check them, so nothing is
  // used up until the person presses Continue.
  const hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get('token_hash')){ renderContinue(hp.get('token_hash'), hp.get('type') || 'magiclink'); return; }
  const {data} = await sb.auth.getSession();
  if (data && data.session) startApp(data.session.user);
  else renderLogin(errHash ? '⚠ ' + decodeURIComponent(errHash[1].replace(/\+/g, ' ')) + '. Ask for a new link below.' : '');
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'SIGNED_IN' && session && !USER) startApp(session.user);
    if (ev === 'SIGNED_OUT' && USER){ USER = null; renderLogin(''); }
  });
})();
</script>
</body>
</html>
